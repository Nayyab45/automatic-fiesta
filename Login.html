        /* Custom styles for autofill and focus rings to match the premium aesthetic */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #fdf8f5 inset !important;

        }

<body class="bg-surface text-on-surface font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Wrapper: Suppressing navigation shell for Login (Linear/Transactional intent) -->
<main class="min-h-screen relative flex flex-col items-center justify-center p-container-padding overflow-hidden">
<!-- Ambient Background: Soft, out of focus luxury texture -->
<div class="absolute inset-0 z-0 bg-cover bg-center opacity-40 mix-blend-multiply" data-alt="A highly blurred, soft-focus photograph of a high-end restaurant interior at golden hour. Warm light cascades across linen tables. The aesthetic is extremely minimalist, utilizing soft cream and muted gold tones to create a luxurious, physical paper-like texture." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDKTS6JDk_rfEjGV4JPzzER57KCLfI9zwbMSrgdWpC9A8vTWq-5laA8gffGnEnrPDSlwJuInIalX8Ca4oba3eXV46bWGkQKqSbqU4pwnKMAwTNPmCiVkDwPb-q0b7RxidXE5efMjtpBj6p4P6U5fgqXP5rModddUQotFWz6LrlYe3u0jwTkKnklmAC3MGE4YfIB2inF_mZok1mpKAfHvzHObhRV4pzD4Ldx_hfZ0UMLOD6oHmjuJQfH')">
</div>
<!-- Subtle Gradient Scrim to ensure text readability -->
<div class="absolute inset-0 z-0 bg-gradient-to-b from-surface/80 to-surface backdrop-blur-[2px]"></div>
<!-- Login Canvas -->
<div class="relative z-10 w-full max-w-[420px] flex flex-col items-center">
<!-- Brand Anchor -->
<header class="flex flex-col items-center text-center gap-stack-sm mb-stack-lg w-full">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">What Should We Eat?</h1>

</header>
<!-- Card Container: Tactile paper feel -->
<div class="w-full bg-surface rounded-xl p-8 sm:p-10 shadow-[0_4px_16px_rgba(0,0,0,0.04)] border-[0.5px] border-outline-variant/40 flex flex-col">
<!-- Welcome Message -->
<div class="flex flex-col items-center text-center gap-unit mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your dining journey.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-md w-full" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-unit group">
<label class="font-label-sm text-label-sm text-on-surface-variant group-focus-within:text-primary transition-colors" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline-variant group-focus-within:text-primary transition-colors" style="font-size: 20px;">mail</span>
<input class="w-full h-12 bg-transparent border-0 border-b-[1.5px] border-outline-variant focus:border-primary focus:ring-0 pl-8 pr-2 font-body-lg text-body-lg text-on-surface transition-colors placeholder:text-outline-variant/50" id="email" placeholder="name@example.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-unit group mt-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant group-focus-within:text-primary transition-colors" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline-variant group-focus-within:text-primary transition-colors" style="font-size: 20px;">lock</span>
<input class="w-full h-12 bg-transparent border-0 border-b-[1.5px] border-outline-variant focus:border-primary focus:ring-0 pl-8 pr-10 font-body-lg text-body-lg text-on-surface transition-colors placeholder:text-outline-variant/50" id="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-0 text-outline-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-unit">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors py-2" href="#">Forgot Password?</a>
</div>
<!-- Primary Action Button -->
<button class="w-full h-12 mt-stack-sm bg-primary-container text-on-primary-container font-label-lg text-label-lg rounded-full flex items-center justify-center gap-unit hover:bg-primary hover:text-on-primary transition-all duration-300 active:scale-[0.98] shadow-sm" type="submit">
<span class="">Sign In</span>
<span class="material-symbols-outlined" style="font-size: 18px;">arrow_right_alt</span>
</button>
</form>
<!-- Social Login Divider -->
<div class="flex items-center gap-gutter my-stack-lg w-full">
<div class="h-[0.5px] bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Or continue with</span>
<div class="h-[0.5px] bg-outline-variant flex-1"></div>
</div>
<!-- Social Buttons -->
<div class="flex gap-stack-md w-full">
<button class="flex-1 h-12 border-[1.5px] border-outline-variant rounded-full flex items-center justify-center gap-stack-sm hover:border-primary hover:bg-surface-container-low transition-all duration-200 active:scale-[0.98]" type="button">
<svg class="w-5 h-5 text-on-surface" fill="currentColor" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</button>
<button class="flex-1 h-12 border-[1.5px] border-outline-variant rounded-full flex items-center justify-center gap-stack-sm hover:border-primary hover:bg-surface-container-low transition-all duration-200 active:scale-[0.98]" type="button">
<svg class="w-5 h-5 text-on-surface" fill="currentColor" viewBox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.15 2.95.97 3.63 2.38-3.52 2.32-2.88 7.1.6 8.54-.7 1.83-1.63 3.53-2.88 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path>
</svg>
</button>
</div>
</div>
<!-- Sign Up Link -->
<div class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-label-lg text-label-lg hover:text-primary-fixed-dim hover:underline underline-offset-4 transition-colors ml-unit" href="#">Sign Up</a>
</p>
</div>
</div>
</main>


</body></html>
