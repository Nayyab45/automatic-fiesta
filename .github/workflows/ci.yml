name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      # Only the fast, mocked-DB unit tests (tests/) run here -- the
      # live-database integration suite (test/api.test.js) needs a real
      # MySQL instance plus several third-party API keys (see .env.example)
      # and isn't set up in this workflow. Run it locally/on staging with
      # `npm test` once those are configured.
      - run: npm run test:unit

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dinner-ionic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Dinner-ionic/package-lock.json
      - run: npm ci
      - run: npm run test:ci
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
