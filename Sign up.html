<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden bg-pattern">
<!-- Top-level Navigation Shell Suppressed as per instructions for Login/Sign-up intent -->

<div class="absolute top-0 left-0 w-32 h-32 opacity-20 pointer-events-none" style="background: radial-gradient(circle at top left, #b89b5e, transparent 70%);"></div>

<!-- Header -->

<h1 class="font-display-lg text-headline-lg text-primary mb-unit">What Should We Eat?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join our exclusive dining concierge</p>
</header>
<!-- Sign Up Card -->
<div class="bg-surface rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.04)] p-8 border border-outline-variant/30">
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Name Field -->
<div class="input-floating rounded-lg border border-secondary-fixed-dim focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-md text-body-md h-14 rounded-lg outline-none" id="name" name="name" placeholder=" " required="" type="text">
<label class="font-body-md text-body-md" for="name">Full Name</label>
</div>
<!-- Email Field -->
<div class="input-floating rounded-lg border border-secondary-fixed-dim focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-md text-body-md h-14 rounded-lg outline-none" id="email" name="email" placeholder=" " required="" type="email">
<label class="font-body-md text-body-md" for="email">Email Address</label>
</div>
<!-- Password Field -->
<div class="input-floating rounded-lg border border-secondary-fixed-dim focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-md text-body-md h-14 rounded-lg outline-none" id="password" name="password" placeholder=" " required="" type="password">
<label class="font-body-md text-body-md" for="password">Password</label>
</div>
<!-- Terms -->
<div class="flex items-center gap-2 mt-2">
<input class="rounded border-outline text-primary-container focus:ring-primary-container w-4 h-4 bg-transparent cursor-pointer" id="terms" name="terms" required="" type="checkbox">
<label class="font-label-sm text-label-sm text-on-surface-variant cursor-pointer" for="terms">
                        I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> &amp; <a class="text-primary hover:underline" href="#">Privacy Policy</a>
</label>
</div>
<!-- Submit Button -->
<button class="mt-stack-sm w-full h-12 bg-primary-container text-on-primary rounded-lg font-label-lg text-label-lg uppercase tracking-wider hover:bg-primary transition-colors flex items-center justify-center gap-2" type="submit">
                    Create Account
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="mt-stack-lg mb-stack-md flex items-center justify-center w-full">
<hr class="w-full border-outline-variant/50">
