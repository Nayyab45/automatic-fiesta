<header class="w-full top-0 sticky bg-surface z-40 flex items-center justify-between px-container-padding py-stack-md border-b border-outline-variant/20 shadow-sm">
  <button
    *ngIf="showBack"
    (click)="back.emit()"
    aria-label="Go back"
    class="interactive-element p-2 -ml-2 rounded-full hover:bg-surface-variant/50 text-on-surface"
  >
    <span class="material-symbols-outlined text-[24px]">{{ backIcon }}</span>
  </button>
  <div *ngIf="!showBack" class="w-10"></div>

  <div class="flex-1 text-center min-w-0 px-2">
    <h1 class="font-headline-md text-headline-md text-on-surface truncate">{{ title }}</h1>
    <p *ngIf="subtitle" class="font-body-md text-body-md text-on-surface-variant truncate">{{ subtitle }}</p>
  </div>

  <div class="min-w-10 flex items-center justify-end gap-1">
    <ng-content></ng-content>
  </div>
</header>
