<header class="w-full sticky top-0 z-40 bg-surface dark:bg-surface flex items-center justify-between px-container-padding pt-safe pb-stack-md">
  <div
    (click)="openLocationPicker()"
    class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity"
    role="button"
    tabindex="0"
  >
    <span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">place</span>
    <div class="flex flex-col leading-tight">
      <span *ngIf="locationService.isTraveling()" class="font-label-sm text-label-sm text-tertiary -mb-0.5">Traveling in</span>
      <span class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim font-bold">{{ cityLabel }}</span>
    </div>
  </div>

  <div class="flex items-center gap-stack-sm">
    <ng-content></ng-content>
  </div>
</header>
