<header class="w-full top-0 sticky bg-background flex items-center justify-between px-container-padding py-stack-md z-10">
<button (click)="goBack()" aria-label="Go back" class="text-primary hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tight">What Should We Eat?</h1>
<div class="w-10"></div> 
</header>

<main class="flex-grow flex flex-col items-center px-container-padding py-stack-lg relative z-0 mt-stack-md">

<div class="text-center w-full mb-section-gap">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm">Let's verify it's you</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                Position your face within the frame and make sure you're in a well-lit area.
            </p>
</div>

<div class="relative w-64 h-80 flex items-center justify-center mb-stack-lg">

<div class="absolute inset-0 rounded-[100px] overflow-hidden bg-surface-container-low shadow-[0_4px_16px_0_rgba(0,0,0,0.04)] border-[1.5px] border-primary-container z-0 flex items-center justify-center">
<img class="absolute inset-0 w-full h-full object-cover opacity-60 mix-blend-multiply filter blur-sm" data-alt="A softly lit, out-of-focus background representing a blurred view from a front-facing mobile camera. The scene suggests a warm, elegant interior space with gentle natural light and subtle champagne tones. The aesthetic is clean, premium, and sophisticated, acting as a backdrop for a face verification step in a luxury dining app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDGjj2nZsQ6Wxcd37yshBGiHr6oz4rwSutF1jm2GgQHoa6yVzklrSv966VLYRAq00EzaLyTHdDyyltPZ272DJNnvd_IrDRHL8Mi4nmQriamPihXD3TMxyPuf7Ln0k51HZzYTGBCLuQvlnYFvNgTLCa9uPijfzPQtb8bz9aB8NSe7-E6cpplnHzGRGHkrYDRfyuSgKXogTRjS2jQUAbV3wFrWoSFNr6rbxjhUsPxBDJHyQnVkRVZEE9m"/>

<div class="w-40 h-56 rounded-full border border-dashed border-primary/40 absolute z-10 pulse-ring"></div>
</div>

<div class="absolute -inset-10 bg-background/30 camera-overlay pointer-events-none z-10"></div>
</div>

<div class="flex items-center justify-center space-x-2 bg-surface-container-high px-4 py-2 rounded-full shadow-sm mb-auto">
<span class="material-symbols-outlined text-primary-container text-[18px]" data-icon="face" style="font-variation-settings: 'FILL' 1;">face</span>
<span class="font-label-sm text-label-sm text-on-surface">Ready to capture</span>
</div>
</main>

<footer class="w-full px-container-padding pb-section-gap pt-stack-md bg-gradient-to-t from-background via-background to-transparent relative z-20 flex flex-col items-center">
<button (click)="go('/identity-verification-submit-review')" class="w-full h-14 bg-primary-container text-on-primary font-title-lg text-title-lg rounded-xl shadow-[0_4px_16px_0_rgba(0,0,0,0.08)] flex items-center justify-center space-x-2 hover:opacity-90 active:scale-[0.98] transition-all duration-200 border-[1px] border-primary-container/50 mb-stack-md">
<span class="material-symbols-outlined" data-icon="camera" style="font-variation-settings: 'FILL' 1;">camera</span>
<span>Capture</span>
</button>
<div class="flex items-center space-x-2 opacity-70">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant" data-icon="lock" style="font-variation-settings: 'FILL' 0;">lock</span>
<p class="font-label-sm text-label-sm text-on-surface-variant text-center max-w-[260px]">
                Your data is encrypted and used only for identity verification.
            </p>
</div>
</footer>
