<header class="w-full top-0 sticky bg-surface z-50 flex justify-between items-center px-gutter py-unit w-full max-w-7xl mx-auto h-16">
<button (click)="goBack()" aria-label="Go back" class="w-12 h-12 flex items-center justify-center text-primary rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">arrow_back</span>
</button>
<div class="flex-1 flex justify-center">

</div>
<div class="w-12 h-12"></div> 
</header>

<main class="flex-1 flex flex-col items-center justify-center px-container-padding py-stack-lg max-w-md mx-auto w-full">

<div class="w-full bg-surface-container-lowest rounded-xl p-container-padding flex flex-col items-center text-center shadow-[0_4px_16px_0_rgba(0,0,0,0.04)] relative overflow-hidden group">

<div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 bg-secondary-container rounded-full opacity-20 blur-xl"></div>
<div class="absolute bottom-0 left-0 -ml-8 -mb-8 w-24 h-24 bg-primary-container rounded-full opacity-10 blur-lg"></div>

<div class="w-20 h-20 bg-secondary-container rounded-full flex items-center justify-center text-on-secondary-container mb-stack-lg relative z-10">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">mark_email_read</span>
</div>

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-stack-sm relative z-10">
                Check your email
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg relative z-10 max-w-[280px]">
                We've sent a password reset link to your email. Didn't get it? 
                <button class="text-primary font-semibold hover:opacity-80 transition-opacity underline decoration-primary/30 underline-offset-2">Resend</button>.
            </p>

<div class="w-full flex flex-col gap-stack-sm relative z-10">
<button class="w-full bg-primary-container text-on-primary h-12 rounded-full font-label-lg text-label-lg flex items-center justify-center hover:opacity-90 transition-opacity active:scale-[0.98]">
                    Open Email App
                </button>
<button (click)="go('/login')" class="w-full border border-outline-variant text-on-surface-variant h-12 rounded-full font-label-lg text-label-lg flex items-center justify-center hover:bg-surface-container-lowest transition-colors active:scale-[0.98] mt-unit">
                    Back to Login
                </button>
</div>
</div>
</main>
