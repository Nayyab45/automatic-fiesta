<app-header title="Privacy Policy" (back)="goBack()">
  <button (click)="go('/profile')" aria-label="Account" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 text-on-surface">
    <span class="material-symbols-outlined">account_circle</span>
  </button>
</app-header>

<main class="flex-1 overflow-y-auto pb-32">
<div class="max-w-3xl mx-auto px-container-padding py-stack-lg">

<div class="mb-stack-lg border-b border-outline-variant/30 pb-stack-md text-center">
<p *ngFor="let line of content().intro.split('\n'); let first = first" class="font-body-md text-body-md text-on-surface-variant" [class.mt-2]="!first" [class.max-w-xl]="!first" [class.mx-auto]="!first">{{ line }}</p>
</div>

<div class="space-y-section-gap font-body-lg text-body-lg text-on-background leading-relaxed">
<section *ngFor="let section of content().sections; let i = index">
<h2 class="font-title-lg text-title-lg text-primary mb-stack-md">{{ i + 1 }}. {{ section.heading }}</h2>
<app-policy-body [body]="section.body"></app-policy-body>
</section>
</div>
</div>
</main>

<div class="fixed bottom-0 left-0 w-full z-50 bg-surface/95 backdrop-blur-md border-t border-outline-variant/20 shadow-[0_-8px_32px_-4px_rgba(0,0,0,0.05)] pt-4 pb-safe pb-8 px-4 flex justify-center gap-4">
<div class="max-w-3xl w-full flex gap-4">
<button (click)="goBack()" class="flex-1 py-3 px-6 rounded-full border border-secondary text-secondary font-label-lg text-label-lg uppercase tracking-wider hover:bg-surface-variant transition-colors duration-200">
                Decline
            </button>
<button (click)="goBack()" class="flex-1 py-3 px-6 rounded-full bg-primary-container text-on-primary hover:opacity-90 transition-opacity duration-200 shadow-md font-label-lg text-label-lg uppercase tracking-wider">
                Accept
            </button>
</div>
</div>
