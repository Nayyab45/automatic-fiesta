<header class="px-container-padding pt-safe pb-stack-lg flex items-center justify-between sticky top-0 bg-background/90 backdrop-blur-md z-40">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">Notifications</h1>
<button (click)="markAllAsRead()" aria-label="Mark all as read" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" [class.text-primary]="hasUnread()" [class.text-outline]="!hasUnread()">done_all</span>
</button>
</header>

<main class="px-container-padding flex-1 flex flex-col gap-stack-lg max-w-3xl mx-auto w-full pb-32">

<p *ngIf="loading()" class="text-center py-section-gap font-body-md text-body-md text-on-surface-variant">Loading notifications…</p>
<p *ngIf="!loading() && notifications().length === 0" class="text-center py-section-gap font-body-md text-body-md text-on-surface-variant">You're all caught up.</p>

<div class="flex flex-col gap-0" *ngIf="!loading() && notifications().length > 0">

<div *ngFor="let n of notifications()" (click)="open(n)" class="flex items-start gap-gutter py-stack-md border-b border-outline-variant/30 hover:bg-surface-container-low transition-colors group" [class.opacity-70]="n.read" [class.cursor-pointer]="n.actorUserId">
<div class="w-12 h-12 rounded-full overflow-hidden shrink-0 bg-surface-container flex items-center justify-center relative">
<span class="material-symbols-outlined text-primary">{{ iconFor(n.type) }}</span>
</div>
<div class="flex-1">
<p class="font-body-lg text-body-lg text-on-surface mb-unit">{{ n.message }}</p>
<p class="font-body-md text-body-md text-outline">{{ timeAgo(n.createdAt) }}</p>
</div>
<div *ngIf="!n.read" class="w-2 h-2 rounded-full bg-primary mt-2"></div>
</div>
</div>
</main>

<app-bottom-nav active="messages"></app-bottom-nav>
