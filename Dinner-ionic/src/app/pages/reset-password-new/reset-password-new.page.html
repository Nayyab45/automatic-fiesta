<div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-surface-container-low to-surface opacity-50 -z-10"></div>
<div class="w-full max-w-md px-container-padding flex flex-col h-full justify-between pb-section-gap pt-stack-lg relative z-10">

<header class="flex items-center justify-start mb-section-gap">
<button (click)="go('/login')" aria-label="Go back" class="p-2 -ml-2 text-on-surface-variant hover:opacity-80 transition-opacity rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</header>

<main class="flex-grow flex flex-col items-center text-center">

<div class="w-24 h-24 mb-stack-lg bg-surface-container-highest rounded-full flex items-center justify-center shadow-sm relative overflow-hidden">
<div class="absolute inset-0 bg-primary opacity-5 mix-blend-multiply"></div>
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="lock_reset" style="font-variation-settings: 'FILL' 0;">lock_reset</span>
</div>

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-md">Set a new password</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto mb-section-gap">
                Choose a new password for your account.
            </p>

<form [formGroup]="form" (ngSubmit)="submit()" class="w-full max-w-sm flex flex-col gap-stack-lg">

@if (errorMessage()) {
<p class="font-body-md text-body-md text-error" role="alert">{{ errorMessage() }}</p>
}

<div class="relative w-full input-focus-ring rounded-xl border border-surface-variant bg-surface-bright transition-all duration-200">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant opacity-70">lock</span>
</div>
<input formControlName="password" [type]="passwordVisible ? 'text' : 'password'" class="w-full pl-12 pr-12 py-4 bg-transparent border-none text-on-surface font-body-lg text-body-lg focus:ring-0 placeholder:text-on-surface-variant placeholder:opacity-50 rounded-xl" id="password" placeholder="New password"/>
<button (click)="passwordVisible = !passwordVisible" aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-4 flex items-center text-on-surface-variant opacity-70 hover:opacity-100 transition-opacity" type="button">
<span class="material-symbols-outlined">{{ passwordVisible ? 'visibility' : 'visibility_off' }}</span>
</button>
</div>
<p *ngIf="passwordErrorMessage as msg" class="font-label-sm text-label-sm text-error text-left -mt-stack-sm" role="alert">{{ msg }}</p>
<p *ngIf="!passwordErrorMessage" class="font-label-sm text-label-sm text-on-surface-variant text-left -mt-stack-sm">At least 8 characters, with a number and a special character.</p>

<div class="relative w-full input-focus-ring rounded-xl border border-surface-variant bg-surface-bright transition-all duration-200">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant opacity-70">lock</span>
</div>
<input formControlName="confirmPassword" [type]="passwordVisible ? 'text' : 'password'" class="w-full pl-12 pr-4 py-4 bg-transparent border-none text-on-surface font-body-lg text-body-lg focus:ring-0 placeholder:text-on-surface-variant placeholder:opacity-50 rounded-xl" id="confirmPassword" placeholder="Confirm new password"/>
</div>

<button [disabled]="submitting() || !token" class="w-full bg-primary-container text-on-primary py-4 rounded-xl font-label-lg text-label-lg uppercase tracking-wider shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-150 flex justify-center items-center gap-2 disabled:opacity-60" type="submit">
                    {{ submitting() ? 'Saving…' : 'Reset Password' }}
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
</main>

<footer class="mt-auto pt-section-gap flex justify-center w-full">
<a (click)="go('/login')" class="inline-flex items-center gap-1 font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-colors py-2 px-4 rounded-full hover:bg-surface-container-low">
                Back to Login
            </a>
</footer>
</div>
