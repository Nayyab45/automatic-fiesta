<div class="w-full max-w-md bg-surface h-full flex flex-col md:max-w-3xl md:mx-auto md:border-x md:border-surface-variant md:shadow-sm">
<header class="flex justify-between items-center w-full px-container-padding py-2 bg-surface flex-shrink-0">
<button (click)="goBack()" class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 -ml-2 rounded-full active:scale-95 duration-150" type="button">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex-grow"></div>
<div class="text-right">
<span class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider">Step 2 of 3</span>
</div>
</header>
<main class="flex-grow px-container-padding pb-4 flex flex-col gap-3 md:gap-4 mx-auto w-full max-w-lg overflow-hidden">
<div class="text-center md:text-left flex flex-col flex-shrink-0">
<h1 class="font-headline-md text-headline-md md:font-headline-lg md:text-headline-lg text-on-surface">Tell us about yourself</h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-tight mt-1">We'll use this to personalize your dining experience.</p>
</div>
<div class="flex flex-row items-center justify-center gap-4 flex-shrink-0 md:justify-start">
<div class="relative group cursor-pointer">
<div class="w-16 h-16 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center overflow-hidden shadow-[0_4px_16px_rgba(0,0,0,0.04)] transition-all duration-300 group-hover:border-primary-container">
<span class="material-symbols-outlined text-3xl text-on-surface-variant opacity-50">person</span>
</div>
<div class="absolute bottom-0 right-0 bg-primary-container text-on-primary rounded-full p-1 shadow-sm flex items-center justify-center transform translate-x-1/4 -translate-y-1/4">
<span class="material-symbols-outlined text-[14px]">add_a_photo</span>
</div>
</div>
<div class="text-left">
<p class="font-title-lg text-title-lg text-on-surface leading-tight">Profile Photo</p>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Upload a clear photo of your face.</p>
</div>
</div>
<form class="flex flex-col gap-2 flex-grow min-h-0 overflow-y-auto pr-1 pb-1">
<div class="flex flex-col">
<label class="font-label-lg text-[10px] text-on-surface-variant uppercase" for="name">Full Name</label>
<input [(ngModel)]="name" class="input-underline font-body-md text-body-md text-on-surface focus:ring-0" id="name" name="name" placeholder="Enter your full name" type="text"/>
</div>
<div class="grid grid-cols-2 gap-x-4 gap-y-2">
<div class="flex flex-col">
<label class="font-label-lg text-[10px] text-on-surface-variant uppercase" for="age">Age</label>
<input [(ngModel)]="age" class="input-underline font-body-md text-body-md text-on-surface focus:ring-0" id="age" name="age" placeholder="e.g. 28" type="number"/>
</div>
<div class="flex flex-col relative">
<label class="font-label-lg text-[10px] text-on-surface-variant uppercase" for="province">Province</label>
<select [(ngModel)]="province" (change)="onProvinceChange($event)" class="input-underline font-body-md text-body-md text-on-surface focus:ring-0 appearance-none bg-transparent" id="province" name="province">
<option disabled="" selected="" value="">Select Province</option>
<option value="punjab">Punjab</option>
<option value="sindh">Sindh</option>
<option value="kpk">KPK</option>
<option value="balochistan">Balochistan</option>
<option value="islamabad">Islamabad</option>
<option value="gilgit-baltistan">GB</option>
<option value="ajk">AJK</option>
</select>
<div class="absolute right-0 bottom-1 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">expand_more</span>
</div>
</div>
</div>
<div class="flex flex-col relative">
<label class="font-label-lg text-[10px] text-on-surface-variant uppercase" for="city">City</label>
<select [(ngModel)]="city" class="input-underline font-body-md text-body-md text-on-surface focus:ring-0 appearance-none bg-transparent" id="city" name="city">
<option disabled value="">Select City</option><option *ngFor="let c of cities" [value]="c">{{ c }}</option>
</select>
<div class="absolute right-0 bottom-1 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">expand_more</span>
</div>
</div>
<div class="flex flex-col">
<label class="font-label-lg text-[10px] text-on-surface-variant uppercase" for="bio">Short Bio</label>
<textarea [(ngModel)]="bio" class="input-underline font-body-md text-body-md text-on-surface focus:ring-0 resize-none py-1" id="bio" name="bio" placeholder="A brief introduction..." rows="1"></textarea>
</div>
<div class="flex flex-col gap-1 mt-1">
<p class="font-label-lg text-[10px] text-on-surface-variant uppercase flex justify-between items-center">
                        Favorite Pakistani Foods
                        <span class="material-symbols-outlined text-[14px] cursor-pointer hover:text-primary">edit</span>
</p>
<div class="flex flex-wrap gap-1.5">
<span *ngFor="let food of favoriteFoods; let i = index" class="inline-flex items-center px-2.5 py-0.5 rounded-full bg-tertiary/10 text-tertiary font-label-sm text-[11px] border border-tertiary/20">
                            {{ food }}
                            <span (click)="removeFavoriteFood(i)" class="material-symbols-outlined text-[14px] ml-0.5 cursor-pointer hover:text-on-surface">close</span>
</span>
<button (click)="addFavoriteFood()" class="inline-flex items-center px-2.5 py-0.5 rounded-full border border-dashed border-outline-variant text-on-surface-variant hover:border-primary hover:text-primary transition-colors font-label-sm text-[11px]" type="button">
<span class="material-symbols-outlined text-[14px] mr-0.5">add</span> Add More
                        </button>
</div>
</div>
</form>
<div class="pt-2 flex-shrink-0 mt-4">
<button (click)="submit()" [disabled]="submitting()" class="w-full bg-primary-container text-on-primary font-title-lg text-[16px] py-3 rounded-full shadow-[0_4px_16px_rgba(0,0,0,0.04)] hover:opacity-90 active:scale-[0.98] active:border active:border-primary-container transition-all duration-150 flex items-center justify-center gap-2 disabled:opacity-60" type="button">
                    {{ submitting() ? 'Saving…' : 'Create Profile' }}
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</main>
</div>
