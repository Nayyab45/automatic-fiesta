<div class="w-full max-w-[480px] min-h-screen relative shadow-[0_0_40px_rgba(0,0,0,0.05)] bg-surface pb-stack-lg">

<header class="bg-surface sticky top-0 z-50 flex justify-between items-center px-container-padding py-stack-sm w-full border-b-[0.5px] border-outline-variant">
<button (click)="goBack()" aria-label="Go back" class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-2 rounded-full -ml-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tight">Help &amp; Support</h1>
<div class="w-10"></div> 
</header>

<main class="px-container-padding pt-stack-lg flex flex-col gap-section-gap">

<section class="flex flex-col gap-stack-sm">
<p class="font-body-md text-body-md text-on-surface-variant">How can we help you today?</p>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline-variant pl-2" data-icon="search">search</span>
<input class="w-full input-bottom-line pl-10 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant transition-colors" placeholder="Search help articles" type="text"/>
</div>
</section>

<section class="flex flex-col gap-stack-md">
<h2 class="font-title-lg text-title-lg text-primary">Frequently Asked Questions</h2>
<div class="glass-card flex flex-col overflow-hidden border border-surface-variant">

<div *ngFor="let faq of faqs; let i = index" (click)="toggleFaq(i)" class="border-b-[0.5px] border-outline-variant last:border-b-0 cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="flex justify-between items-center p-stack-md">
<span class="font-body-lg text-body-lg text-on-surface font-medium">{{ faq.question }}</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" [class.rotate-180]="openFaqIndex === i" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
<p *ngIf="openFaqIndex === i" class="font-body-md text-body-md text-on-surface-variant px-stack-md pb-stack-md">{{ faq.answer }}</p>
</div>
</div>
</section>

<section class="flex flex-col gap-stack-md">
<h2 class="font-title-lg text-title-lg text-primary">Need more help?</h2>
<div class="flex flex-col gap-stack-sm">

<button (click)="go('/messages')" class="glass-card p-stack-md flex items-center gap-stack-md hover:bg-surface-container-low transition-colors active:border-primary-container active:border border border-transparent text-left w-full">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-secondary-container" data-icon="chat_bubble" data-weight="fill" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Chat with us</span>
<span class="font-body-md text-body-md text-on-surface-variant">Typically replies in a few minutes</span>
</div>
</button>

<button (click)="emailSupport()" class="glass-card p-stack-md flex items-center gap-stack-md hover:bg-surface-container-low transition-colors active:border-primary-container active:border border border-transparent text-left w-full">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="mail">mail</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Email support</span>
<span class="font-body-md text-body-md text-on-surface-variant">support&#64;whatshouldweeat.com</span>
</div>
</button>

<button (click)="go('/report-users')" class="glass-card p-stack-md flex items-center gap-stack-md hover:bg-error-container transition-colors active:border-error active:border border border-transparent text-left w-full mt-stack-sm">
<div class="w-12 h-12 rounded-full bg-error-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-error" data-icon="security" data-weight="fill" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Report a safety issue</span>
<span class="font-body-md text-body-md text-on-surface-variant">Urgent concerns during a meetup</span>
</div>
</button>
</div>
</section>
</main>
</div>
