<app-header title="User Management" (back)="goBack()"></app-header>
<main class="flex-1 overflow-y-auto px-container-padding py-stack-md flex flex-col gap-stack-md">

<div class="relative w-full h-12 shrink-0">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input [(ngModel)]="search" (keyup.enter)="load()" type="search" placeholder="Search by name or email" class="w-full h-full pl-12 pr-4 bg-surface-container-lowest border-b border-outline-variant focus:border-primary-container focus:ring-0 outline-none font-body-md text-body-md text-on-surface placeholder:text-outline bg-transparent"/>
</div>

<div class="flex overflow-x-auto hide-scrollbar gap-unit py-unit shrink-0">
<button *ngFor="let f of filters" (click)="selectStatus(f.value)" class="px-4 py-2 rounded-full whitespace-nowrap flex-shrink-0 font-label-lg text-label-lg transition-colors" [class.border-1.5]="status === f.value" [class.border-primary]="status === f.value" [class.bg-secondary-container]="status === f.value" [class.text-on-secondary-container]="status === f.value" [class.border]="status !== f.value" [class.border-outline-variant]="status !== f.value" [class.text-on-surface-variant]="status !== f.value">{{ f.label }}</button>
</div>

<p *ngIf="loading()" class="text-center py-section-gap font-body-md text-body-md text-on-surface-variant">Loading…</p>

<div *ngIf="!loading() && forbidden()" class="flex flex-col items-center justify-center text-center py-section-gap h-64">
<span class="material-symbols-outlined text-[40px] text-error mb-stack-md">block</span>
<h3 class="font-headline-md text-headline-md text-on-surface mb-stack-sm text-[20px]">Admins only</h3>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[250px]">You don't have access to this page.</p>
</div>

<p *ngIf="!loading() && !forbidden() && users().length === 0" class="text-center py-section-gap font-body-md text-body-md text-on-surface-variant">No users match.</p>

<ul *ngIf="!loading() && users().length > 0" class="flex flex-col">
<li *ngFor="let user of users()" (click)="go('/admin/users/' + user.id)" class="flex items-center justify-between gap-gutter py-stack-md border-b border-outline-variant/30 cursor-pointer" role="link" tabindex="0" (keydown.enter)="$event.target === $event.currentTarget && go('/admin/users/' + user.id)">
<div class="flex flex-col gap-unit min-w-0">
<span class="font-title-lg text-title-lg text-on-surface truncate">{{ user.name }}</span>
<span class="font-body-md text-body-md text-on-surface-variant text-[13px] truncate">{{ user.email }}</span>
<div class="flex flex-wrap gap-2 mt-unit">
<span *ngIf="user.isAdmin" class="font-label-sm text-label-sm text-primary bg-primary/10 px-2 py-0.5 rounded-md">Admin</span>
<span *ngIf="user.suspendedAt" class="font-label-sm text-label-sm text-error bg-error/10 px-2 py-0.5 rounded-md">Suspended</span>
<span *ngIf="user.flaggedAt" class="font-label-sm text-label-sm text-error bg-error/10 px-2 py-0.5 rounded-md">Flagged</span>
<span *ngIf="user.verified" class="font-label-sm text-label-sm text-secondary bg-secondary-container/40 px-2 py-0.5 rounded-md">Verified</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</li>
</ul>
</main>
