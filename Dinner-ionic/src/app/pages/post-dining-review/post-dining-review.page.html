<main class="w-full max-w-md bg-surface rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.04)] overflow-hidden border border-surface-container-high relative">

<app-header title="Feedback" backIcon="close" (back)="goBack()"></app-header>

<div class="px-container-padding py-stack-lg flex flex-col gap-section-gap">

<section class="text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-stack-sm">How was your table?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Your insights curate the What Should We Eat? experience.</p>
</section>

<section class="flex flex-col gap-stack-md">

<div class="flex items-center justify-between pb-stack-sm border-b border-surface-variant/50">
<span class="font-body-lg text-body-lg text-on-surface">Food</span>
<div class="star-rating flex gap-unit" data-category="food">
<button *ngFor="let star of stars" (click)="foodRating.set(star)" type="button" [class.text-primary]="star <= foodRating()" [class.text-outline-variant]="star > foodRating()"><span class="material-symbols-outlined text-2xl" [style.font-variation-settings]="star <= foodRating() ? '\'FILL\' 1' : '\'FILL\' 0'">star</span></button>
</div>
</div>

<div class="flex items-center justify-between pb-stack-sm border-b border-surface-variant/50">
<span class="font-body-lg text-body-lg text-on-surface">Restaurant</span>
<div class="star-rating flex gap-unit" data-category="restaurant">
<button *ngFor="let star of stars" (click)="restaurantRating.set(star)" type="button" [class.text-primary]="star <= restaurantRating()" [class.text-outline-variant]="star > restaurantRating()"><span class="material-symbols-outlined text-2xl" [style.font-variation-settings]="star <= restaurantRating() ? '\'FILL\' 1' : '\'FILL\' 0'">star</span></button>
</div>
</div>

<div class="flex items-center justify-between pb-stack-sm border-b border-surface-variant/50">
<span class="font-body-lg text-body-lg text-on-surface">Conversation</span>
<div class="star-rating flex gap-unit" data-category="conversation">
<button *ngFor="let star of stars" (click)="conversationRating.set(star)" type="button" [class.text-primary]="star <= conversationRating()" [class.text-outline-variant]="star > conversationRating()"><span class="material-symbols-outlined text-2xl" [style.font-variation-settings]="star <= conversationRating() ? '\'FILL\' 1' : '\'FILL\' 0'">star</span></button>
</div>
</div>

<div class="flex items-center justify-between pb-stack-sm border-b border-surface-variant/50 mt-stack-sm">
<span class="font-title-lg text-title-lg text-primary">Overall experience</span>
<div class="star-rating flex gap-unit" data-category="overall">
<button *ngFor="let star of stars" (click)="overallRating.set(star)" type="button" [class.text-primary]="star <= overallRating()" [class.text-outline-variant]="star > overallRating()"><span class="material-symbols-outlined text-3xl" [style.font-variation-settings]="star <= overallRating() ? '\'FILL\' 1' : '\'FILL\' 0'">star</span></button>
</div>
</div>
</section>

<section class="flex flex-col gap-stack-md">
<h3 class="font-body-lg text-body-lg text-on-surface">Would you dine with this group again?</h3>
<div class="flex gap-gutter">
<div class="flex-1">
<input [(ngModel)]="dineAgain" class="chip-radio hidden" id="dine-yes" name="dine-again" type="radio" value="yes"/>
<label class="block w-full text-center py-stack-sm px-container-padding rounded-full border border-outline-variant font-label-lg text-label-lg text-on-surface-variant cursor-pointer transition-colors duration-200" for="dine-yes">Yes</label>
</div>
<div class="flex-1">
<input [(ngModel)]="dineAgain" class="chip-radio hidden" id="dine-maybe" name="dine-again" type="radio" value="maybe"/>
<label class="block w-full text-center py-stack-sm px-container-padding rounded-full border border-outline-variant font-label-lg text-label-lg text-on-surface-variant cursor-pointer transition-colors duration-200" for="dine-maybe">Maybe</label>
</div>
<div class="flex-1">
<input [(ngModel)]="dineAgain" class="chip-radio hidden" id="dine-no" name="dine-again" type="radio" value="no"/>
<label class="block w-full text-center py-stack-sm px-container-padding rounded-full border border-outline-variant font-label-lg text-label-lg text-on-surface-variant cursor-pointer transition-colors duration-200" for="dine-no">No</label>
</div>
</div>
</section>

<section class="flex flex-col gap-stack-sm">
<label class="font-body-lg text-body-lg text-on-surface sr-only" for="review-text">Share your experience</label>
<textarea [(ngModel)]="comment" name="comment" class="w-full bg-transparent border-b border-outline-variant focus:border-primary-container focus:ring-0 resize-none font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 p-2 transition-colors" id="review-text" placeholder="Share your experience..." rows="4"></textarea>
</section>

<section *ngIf="rateablePeople().length > 0" class="flex flex-col gap-stack-md pt-stack-sm border-t border-surface-variant/50">
<h3 class="font-title-lg text-title-lg text-primary">Rate your dining companions</h3>
<div *ngFor="let person of rateablePeople()" class="flex flex-col gap-stack-sm pb-stack-sm border-b border-surface-variant/30 last:border-b-0">
<div class="flex items-center justify-between gap-gutter">
<span class="font-body-lg text-body-lg text-on-surface truncate">{{ person.name }}</span>
<div class="star-rating flex gap-unit">
<button *ngFor="let star of stars" (click)="ratePerson(person.id, star)" type="button" [class.text-primary]="star <= ratingFor(person.id)" [class.text-outline-variant]="star > ratingFor(person.id)"><span class="material-symbols-outlined text-2xl" [style.font-variation-settings]="star <= ratingFor(person.id) ? '\'FILL\' 1' : '\'FILL\' 0'">star</span></button>
</div>
</div>
<textarea [ngModel]="commentFor(person.id)" (ngModelChange)="setComment(person.id, $event)" name="comment-{{ person.id }}" maxlength="500" class="w-full bg-transparent border border-outline-variant/40 rounded-lg focus:border-primary-container focus:ring-0 resize-none font-body-sm text-body-sm text-on-surface placeholder:text-on-surface-variant/50 p-2 transition-colors" placeholder="Add a public review of {{ person.name }} (optional)" rows="2"></textarea>
</div>
</section>
</div>

<div class="px-container-padding py-stack-md bg-surface border-t border-surface-container-high sticky bottom-0">
<button (click)="submit()" [disabled]="submitting()" class="w-full py-stack-md bg-primary-container text-on-primary font-label-lg text-label-lg rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center gap-2 disabled:opacity-60" type="button">
                {{ submitting() ? 'Submitting…' : 'Submit Review' }}
                <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'wght' 300;">arrow_forward</span>
</button>
</div>
</main>
