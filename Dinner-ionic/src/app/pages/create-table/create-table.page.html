<header class="flex justify-between items-center w-full px-container-padding py-stack-md bg-surface sticky top-0 z-40 bg-opacity-90 backdrop-blur-sm">
<button (click)="goBack()" aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Create your table.</h1>
<div class="w-12 h-12"></div> 
</header>
<main class="px-container-padding max-w-2xl mx-auto space-y-section-gap pt-stack-md">

<section class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface-variant">Gathering Type</h2>
<div class="flex flex-wrap gap-stack-sm"><button (click)="selectGatheringType($event)" class="gathering-type-btn gathering-type-selected px-6 py-3 rounded-full border border-outline-variant bg-transparent text-on-surface-variant font-label-lg text-label-lg hover:border-primary-container/50 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-outline-variant gathering-type-icon">dinner_dining</span>
<span class="gathering-type-label">Dinner</span>
</button>
<button (click)="selectGatheringType($event)" class="gathering-type-btn px-6 py-3 rounded-full border border-outline-variant bg-transparent text-on-surface-variant font-label-lg text-label-lg hover:border-primary-container/50 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-outline-variant gathering-type-icon">lunch_dining</span>
<span class="gathering-type-label">Lunch</span>
</button>
<button (click)="selectGatheringType($event)" class="gathering-type-btn px-6 py-3 rounded-full border border-outline-variant bg-transparent text-on-surface-variant font-label-lg text-label-lg hover:border-primary-container/50 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-outline-variant gathering-type-icon">brunch_dining</span>
<span class="gathering-type-label">Brunch</span>
</button>
<button (click)="selectGatheringType($event)" class="gathering-type-btn px-6 py-3 rounded-full border border-outline-variant bg-transparent text-on-surface-variant font-label-lg text-label-lg hover:border-primary-container/50 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-outline-variant gathering-type-icon">local_cafe</span>
<span class="gathering-type-label">Chai Meetup</span>
</button></div>
</section>

<section class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface-variant">The Details</h2>
<div class="space-y-stack-sm">

<div class="relative w-full group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-container transition-colors">search</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl glass-input font-body-md text-on-surface placeholder:text-outline-variant" placeholder="Search upscale restaurants..." type="text"/>
</div>
<div class="grid grid-cols-2 gap-stack-sm">

<div class="relative w-full group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-container transition-colors">calendar_month</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl glass-input font-body-md text-on-surface" type="date"/>
</div>

<div class="relative w-full group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-container transition-colors">schedule</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl glass-input font-body-md text-on-surface" type="time"/>
</div>
</div>
<div class="grid grid-cols-2 gap-stack-sm">

<div class="relative w-full group flex items-center bg-surface-container-low rounded-xl border border-outline-variant/30 px-4 py-3">
<span class="material-symbols-outlined text-outline-variant mr-3">group</span>
<div class="flex-grow">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1">Seats Available</label>
<select class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-on-surface">
<option>2 Guests</option>
<option selected="">4 Guests</option>
<option>6 Guests</option>
<option>8+ Guests</option>
</select>
</div>
</div>

<div class="relative w-full group flex items-center justify-between bg-surface-container-low rounded-xl border border-outline-variant/30 px-4 py-3">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1">Visibility</label>
<span class="font-body-lg text-on-surface block">Public</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
</div>
</div>
</section>

<section class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface-variant">Atmosphere &amp; Intent</h2>
<div class="grid grid-cols-2 md:grid-cols-3 gap-unit"><div (click)="selectAtmosphere($event)" class="atmosphere-card bg-surface-container-low border border-outline-variant/40 rounded-xl p-4 flex flex-col items-center text-center gap-2 cursor-pointer hover:border-primary-container transition-colors">
<span class="material-symbols-outlined text-outline-variant text-[28px] atmosphere-icon">restaurant</span>
<span class="font-label-lg text-label-lg text-on-surface atmosphere-label">Casual Dinner</span>
</div>
<div (click)="selectAtmosphere($event)" class="atmosphere-card atmosphere-selected bg-surface-container-low border border-outline-variant/40 rounded-xl p-4 flex flex-col items-center text-center gap-2 cursor-pointer transition-colors relative overflow-hidden">
<span class="material-symbols-outlined text-outline-variant text-[28px] z-10 atmosphere-icon">forum</span>
<span class="font-label-lg text-label-lg text-on-surface z-10 atmosphere-label">Social Conversation</span>
</div>
<div (click)="selectAtmosphere($event)" class="atmosphere-card bg-surface-container-low border border-outline-variant/40 rounded-xl p-4 flex flex-col items-center text-center gap-2 cursor-pointer hover:border-primary-container transition-colors md:col-span-1 col-span-2">
<span class="material-symbols-outlined text-outline-variant text-[28px] atmosphere-icon">handshake</span>
<span class="font-label-lg text-label-lg text-on-surface atmosphere-label">Business Networking</span>
</div></div>
</section>

<section class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface-variant">A Note to Guests</h2>
<div class="relative">
<textarea class="w-full p-4 rounded-xl glass-input font-body-md text-on-surface resize-none" placeholder="Looking for people who enjoy authentic Pakistani food..." rows="4"></textarea>
<span class="absolute bottom-4 right-4 font-label-sm text-label-sm text-outline-variant">0/200</span>
</div>
</section>

<section class="pt-stack-lg pb-section-gap">
<button (click)="go('/guest-list')" class="w-full bg-primary-container text-on-primary py-4 rounded-xl font-headline-md text-headline-md shadow-sm hover:opacity-90 transition-opacity active:scale-[0.98] transform">
                Create Table
            </button>
</section>
</main>
