<app-header title="Create your table." (back)="goBack()"></app-header>
<main class="px-container-padding max-w-2xl mx-auto space-y-section-gap pt-stack-md">

<section class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface-variant">Gathering Type</h2>
<div class="flex flex-wrap gap-stack-sm"><button (click)="selectGatheringType('Dinner')" [class.gathering-type-selected]="gatheringType === 'Dinner'" class="gathering-type-btn px-6 py-3 rounded-full border border-outline-variant bg-transparent text-on-surface-variant font-label-lg text-label-lg hover:border-primary-container/50 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-outline-variant gathering-type-icon">dinner_dining</span>
<span class="gathering-type-label">Dinner</span>
</button>
<button (click)="selectGatheringType('Lunch')" [class.gathering-type-selected]="gatheringType === 'Lunch'" class="gathering-type-btn px-6 py-3 rounded-full border border-outline-variant bg-transparent text-on-surface-variant font-label-lg text-label-lg hover:border-primary-container/50 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-outline-variant gathering-type-icon">lunch_dining</span>
<span class="gathering-type-label">Lunch</span>
</button>
<button (click)="selectGatheringType('Brunch')" [class.gathering-type-selected]="gatheringType === 'Brunch'" class="gathering-type-btn px-6 py-3 rounded-full border border-outline-variant bg-transparent text-on-surface-variant font-label-lg text-label-lg hover:border-primary-container/50 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-outline-variant gathering-type-icon">brunch_dining</span>
<span class="gathering-type-label">Brunch</span>
</button>
<button (click)="selectGatheringType('Chai Meetup')" [class.gathering-type-selected]="gatheringType === 'Chai Meetup'" class="gathering-type-btn px-6 py-3 rounded-full border border-outline-variant bg-transparent text-on-surface-variant font-label-lg text-label-lg hover:border-primary-container/50 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-outline-variant gathering-type-icon">local_cafe</span>
<span class="gathering-type-label">Chai Meetup</span>
</button></div>
</section>

<section class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface-variant">The Details</h2>
<div class="space-y-stack-sm">

<div class="relative w-full group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-container transition-colors">restaurant</span>
<select [(ngModel)]="restaurantId" name="restaurant" class="w-full pl-12 pr-4 py-4 rounded-xl glass-input font-body-md text-on-surface appearance-none">
<option *ngFor="let restaurant of restaurants()" [value]="restaurant.id">{{ restaurant.name }} — {{ restaurant.city }}</option>
</select>
</div>
<div class="grid grid-cols-2 gap-stack-sm">

<div class="relative w-full group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-container transition-colors">calendar_month</span>
<input [(ngModel)]="date" name="date" class="w-full pl-12 pr-4 py-4 rounded-xl glass-input font-body-md text-on-surface" type="date"/>
</div>

<div class="relative w-full group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-container transition-colors">schedule</span>
<input [(ngModel)]="time" name="time" class="w-full pl-12 pr-4 py-4 rounded-xl glass-input font-body-md text-on-surface" type="time"/>
</div>
</div>
<div class="grid grid-cols-2 gap-stack-sm">

<div class="relative w-full group flex items-center bg-surface-container-low rounded-xl border border-outline-variant/30 px-4 py-3">
<span class="material-symbols-outlined text-outline-variant mr-3">group</span>
<div class="flex-grow">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="seats-available">Seats Available</label>
<select [(ngModel)]="seatsTotal" name="seatsTotal" class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-on-surface" id="seats-available">
<option [value]="2">2 Guests</option>
<option [value]="4">4 Guests</option>
<option [value]="6">6 Guests</option>
<option [value]="8">8+ Guests</option>
</select>
</div>
</div>

<div class="relative w-full group flex items-center justify-between bg-surface-container-low rounded-xl border border-outline-variant/30 px-4 py-3">
<div>
<p class="block font-label-sm text-label-sm text-on-surface-variant mb-1">Visibility</p>
<span class="font-body-lg text-on-surface block">{{ visibility ? 'Public' : 'Private' }}</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input [(ngModel)]="visibility" name="visibility" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>

<div *ngIf="visibility" class="relative w-full flex flex-col gap-1 bg-surface-container-low rounded-xl border border-outline-variant/30 px-4 py-3">
<label class="block font-label-sm text-label-sm text-on-surface-variant" for="audience">Who can join</label>
<select [(ngModel)]="audience" class="font-body-lg text-on-surface bg-transparent focus:ring-0 appearance-none" id="audience" name="audience">
<option *ngFor="let a of audienceOptions" [value]="a.value">{{ a.label }}</option>
</select>
</div>
</div>
</div>
</section>

<section class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface-variant">Atmosphere &amp; Intent</h2>
<div class="grid grid-cols-2 md:grid-cols-3 gap-unit"><div (click)="selectAtmosphere('Casual Dinner')" [class.atmosphere-selected]="atmosphere === 'Casual Dinner'" class="atmosphere-card bg-surface-container-low border border-outline-variant/40 rounded-xl p-4 flex flex-col items-center text-center gap-2 cursor-pointer hover:border-primary-container transition-colors">
<span class="material-symbols-outlined text-outline-variant text-[28px] atmosphere-icon">restaurant</span>
<span class="font-label-lg text-label-lg text-on-surface atmosphere-label">Casual Dinner</span>
</div>
<div (click)="selectAtmosphere('Social Conversation')" [class.atmosphere-selected]="atmosphere === 'Social Conversation'" class="atmosphere-card bg-surface-container-low border border-outline-variant/40 rounded-xl p-4 flex flex-col items-center text-center gap-2 cursor-pointer transition-colors relative overflow-hidden">
<span class="material-symbols-outlined text-outline-variant text-[28px] z-10 atmosphere-icon">forum</span>
<span class="font-label-lg text-label-lg text-on-surface z-10 atmosphere-label">Social Conversation</span>
</div>
<div (click)="selectAtmosphere('Business Networking')" [class.atmosphere-selected]="atmosphere === 'Business Networking'" class="atmosphere-card bg-surface-container-low border border-outline-variant/40 rounded-xl p-4 flex flex-col items-center text-center gap-2 cursor-pointer hover:border-primary-container transition-colors md:col-span-1 col-span-2">
<span class="material-symbols-outlined text-outline-variant text-[28px] atmosphere-icon">handshake</span>
<span class="font-label-lg text-label-lg text-on-surface atmosphere-label">Business Networking</span>
</div></div>
</section>

<section class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface-variant">A Note to Guests</h2>
<div class="relative">
<textarea [(ngModel)]="note" name="note" maxlength="200" class="w-full p-4 rounded-xl glass-input font-body-md text-on-surface resize-none" placeholder="Looking for people who enjoy authentic Pakistani food..." rows="4"></textarea>
<span class="absolute bottom-4 right-4 font-label-sm text-label-sm text-outline-variant">{{ note.length }}/200</span>
</div>
</section>

<section class="pt-stack-lg pb-section-gap">
<p *ngIf="errorMessage()" class="text-error font-body-md text-body-md text-center mb-stack-sm" role="alert">{{ errorMessage() }}</p>
<button (click)="submit()" [disabled]="submitting()" class="w-full bg-primary-container text-on-primary py-4 rounded-xl font-headline-md text-headline-md shadow-sm hover:opacity-90 transition-opacity active:scale-[0.98] transform disabled:opacity-60">
                {{ submitting() ? 'Creating…' : 'Create Table' }}
            </button>
</section>
</main>
