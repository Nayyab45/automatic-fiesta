<header class="fixed top-0 left-0 w-full z-50 transition-all duration-300" id="main-header">
<div class="flex justify-between items-center w-full px-container-padding py-stack-md glass shadow-sm">
<button (click)="goBack()" aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">arrow_back</span>
</button>
<div class="flex gap-2">
<button (click)="toggleSave()" aria-label="Save" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" [style.font-variation-settings]="saved ? '\'FILL\' 1' : '\'FILL\' 0'">bookmark</span>
</button>
<button (click)="share()" aria-label="Share" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">share</span>
</button>
</div>
</div>
</header>
<main class="w-full max-w-md mx-auto pb-32" *ngIf="!loading() && restaurant() as r">

<section class="relative w-full h-[397px] bg-surface-variant">
<div *ngIf="r.photoUrl" class="bg-cover bg-center w-full h-full" [style.background-image]="'url(' + r.photoUrl + ')'"></div>
<div *ngIf="!r.photoUrl" class="w-full h-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-[64px]">restaurant</span>
</div>
<p *ngIf="r.photoUrl && r.photoAttribution" class="absolute top-2 right-2 z-10 font-label-sm text-label-sm text-white/80 bg-black/40 px-2 py-0.5 rounded max-w-[90%] truncate">{{ r.photoAttribution }}</p>

<div class="absolute inset-0 bg-gradient-to-t from-background via-background/40 to-transparent"></div>

<div class="absolute bottom-0 left-0 w-full px-container-padding pb-stack-md flex flex-col gap-unit">
<div class="flex justify-between items-end">
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">{{ r.name }}</h1>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[16px] text-primary">place</span>
                            {{ r.city }}
                        </p>
</div>
<div class="flex flex-col items-end">
<div class="bg-primary-container text-on-primary font-label-lg text-label-lg px-3 py-1 rounded-full flex items-center gap-1 shadow-sm">
<ng-container *ngIf="r.rating !== null; else notRatedDetail">
<span class="material-symbols-outlined fill text-[14px]">star</span>
                            {{ r.rating }}
                        </ng-container>
<ng-template #notRatedDetail>Not yet rated</ng-template>
</div>
</div>
</div>

<div class="flex gap-2 mt-stack-sm flex-wrap">
<span *ngFor="let tag of cuisineTags()" class="px-3 py-1 bg-tertiary/10 text-tertiary font-label-sm text-label-sm rounded-full border border-tertiary/20">{{ tag }}</span>
</div>
</div>
</section>

<div class="px-container-padding flex flex-col gap-section-gap py-stack-lg">

<section class="flex flex-col gap-stack-sm" *ngIf="r.description">
<h2 class="font-title-lg text-title-lg text-on-surface">About</h2>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">{{ r.description }}</p>
</section>

<section class="flex flex-col gap-stack-md" *ngIf="r.dishes.length > 0">
<div class="flex justify-between items-center">
<h2 class="font-title-lg text-title-lg text-on-surface">Popular Dishes</h2>
<button (click)="go('/explore-menu')" class="font-label-lg text-label-lg text-primary hover:underline">View Menu</button>
</div>
<div class="flex gap-gutter overflow-x-auto hide-scrollbar pb-2 -mx-container-padding px-container-padding snap-x">
<div *ngFor="let dish of r.dishes" class="min-w-[160px] max-w-[160px] flex flex-col gap-stack-sm snap-start">
<div class="w-full aspect-square rounded-xl overflow-hidden bg-surface-variant shadow-sm border border-outline-variant/30">
<img [alt]="dish.name" class="w-full h-full object-cover" [src]="dish.photoUrl"/>
</div>
<div>
<h3 class="font-label-lg text-label-lg text-on-surface truncate">{{ dish.name }}</h3>
</div>
</div>
</div>
</section>

<section class="flex flex-col gap-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface">Location</h2>
<div class="w-full h-48 bg-surface-variant rounded-xl overflow-hidden shadow-sm relative border border-outline-variant/50 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl drop-shadow-md">place</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">{{ r.address }}</p>
<button (click)="go('/restaurant-direction/' + r.id)" class="w-full py-3 px-4 border border-outline text-on-surface font-label-lg text-label-lg rounded-full flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[20px]">directions</span>
                    Get Directions
                </button>
</section>
</div>
</main>

<p *ngIf="loading()" class="text-center py-section-gap font-body-md text-body-md text-on-surface-variant">Loading restaurant…</p>
<p *ngIf="!loading() && !restaurant()" class="text-center py-section-gap font-body-md text-body-md text-on-surface-variant">Restaurant not found.</p>

<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant/30 p-4 pb-safe z-40 shadow-[0_-4px_16px_rgba(0,0,0,0.05)]">
<div class="max-w-md mx-auto">
<button (click)="go('/create-table?restaurantId=' + restaurant()?.id)" class="w-full bg-primary-container text-on-primary font-label-lg text-label-lg py-4 rounded-full shadow-sm hover:opacity-90 transition-opacity">
                Create Dining Event
            </button>
</div>
</div>
