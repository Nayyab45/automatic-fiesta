<div class="absolute top-0 left-0 w-32 h-32 opacity-20 pointer-events-none" style="background: radial-gradient(circle at top left, #b89b5e, transparent 70%);"></div>
<div class="absolute bottom-0 right-0 w-48 h-48 opacity-10 pointer-events-none" style="background: radial-gradient(circle at bottom right, #b89b5e, transparent 70%);"></div>
<main class="w-full max-w-md p-container-padding relative z-10">

<header class="text-center mb-stack-lg">
<h1 class="font-display-lg text-headline-lg text-primary mb-unit">What Should We Eat?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join our exclusive dining concierge</p>
</header>

<div class="bg-surface rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.04)] p-8 border border-outline-variant/30">
<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-stack-md">

@if (errorMessage()) {
<p class="font-body-md text-body-md text-error" role="alert">{{ errorMessage() }}</p>
}

<div class="input-floating rounded-lg border border-secondary-fixed-dim focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<input formControlName="name" class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-md text-body-md h-14 rounded-lg outline-none" id="name" placeholder=" " type="text"/>
<label class="font-body-md text-body-md" for="name">Full Name</label>
</div>

<div class="input-floating rounded-lg border border-secondary-fixed-dim focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<input formControlName="email" class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-md text-body-md h-14 rounded-lg outline-none" id="email" placeholder=" " type="email"/>
<label class="font-body-md text-body-md" for="email">Email Address</label>
</div>

<div class="input-floating rounded-lg border border-secondary-fixed-dim focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<input formControlName="password" class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-md text-body-md h-14 rounded-lg outline-none" id="password" placeholder=" " type="password"/>
<label class="font-body-md text-body-md" for="password">Password</label>
</div>

<div class="flex items-center gap-2 mt-2">
<input formControlName="terms" class="rounded border-outline text-primary-container focus:ring-primary-container w-4 h-4 bg-transparent cursor-pointer" id="terms" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-surface-variant cursor-pointer" for="terms">
                        I agree to the <a (click)="go('/terms-of-service')" class="text-primary hover:underline">Terms of Service</a> &amp; <a (click)="go('/privacy-policy')" class="text-primary hover:underline">Privacy Policy</a>
</label>
</div>

<button [disabled]="submitting()" class="mt-stack-sm w-full h-12 bg-primary-container text-on-primary rounded-lg font-label-lg text-label-lg uppercase tracking-wider hover:bg-primary transition-colors flex items-center justify-center gap-2 disabled:opacity-60" type="submit">
                    {{ submitting() ? 'Creating Account…' : 'Create Account' }}
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="mt-stack-lg mb-stack-md flex items-center justify-center w-full">
<hr class="w-full border-outline-variant/50"/>
<span class="px-4 bg-surface font-label-sm text-label-sm text-outline absolute">OR CONTINUE WITH</span>
</div>

<div class="flex flex-col gap-stack-sm">
<button (click)="go('/profile-creation')" class="w-full h-12 rounded-lg border border-secondary-fixed-dim bg-transparent text-on-surface font-body-md text-body-md hover:bg-surface-variant transition-colors flex items-center justify-center gap-3">

<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
<button (click)="go('/profile-creation')" class="w-full h-12 rounded-lg border border-secondary-fixed-dim bg-transparent text-on-surface font-body-md text-body-md hover:bg-surface-variant transition-colors flex items-center justify-center gap-3">

<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.05 2.95.72 3.94 1.81-3.34 1.83-2.6 6.31.63 7.62-.75 1.4-1.58 2.65-3.22 3.58zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path>
</svg>
                    Apple
                </button>
</div>
</div>

<div class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already a member? 
                <a (click)="go('/login')" class="text-primary font-semibold hover:text-primary-container transition-colors">Sign In</a>
</p>
</div>
</main>
