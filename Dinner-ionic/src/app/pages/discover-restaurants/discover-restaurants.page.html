<header class="bg-surface dark:bg-surface flex justify-between items-center w-full px-container-padding py-stack-md sticky top-0 z-40">

<h1 class="font-headline-md text-headline-md font-bold">{{ cityService.label() }}</h1>
</div>
<button (click)="go('/restaurant-direction')" class="ml-2 bg-primary-container text-on-primary px-3 py-1.5 rounded-full hover:opacity-90 transition-all flex items-center gap-1.5 shadow-sm"><span class="material-symbols-outlined text-[18px]">map</span><span class="font-label-lg text-label-lg">Map View</span></button>
</div>

</button>

</div>

<div class="flex flex-col gap-3 mb-stack-md">

<button (click)="selectFilterChip($event)" class="filter-chip filter-chip-selected text-primary font-label-lg text-label-lg px-4 py-2 rounded-full border border-primary whitespace-nowrap flex items-center gap-1 font-bold transition-all"><span class="material-symbols-outlined text-sm filter-chip-check" style='font-variation-settings: "wght" 600;'>check</span>All</button>
<button (click)="selectFilterChip($event)" class="filter-chip bg-surface border border-outline-variant text-on-surface-variant font-label-lg text-label-lg px-4 py-2 rounded-full whitespace-nowrap hover:border-primary transition-all">Punjab</button>
<button (click)="selectFilterChip($event)" class="filter-chip bg-surface border border-outline-variant text-on-surface-variant font-label-lg text-label-lg px-4 py-2 rounded-full whitespace-nowrap hover:border-primary transition-all">Sindh</button>

<button (click)="selectFilterChip($event)" class="filter-chip bg-surface border border-outline-variant text-on-surface-variant font-label-lg text-label-lg px-4 py-2 rounded-full whitespace-nowrap hover:border-primary transition-all">Street Food</button>
</div>
<div class="flex gap-stack-sm overflow-x-auto pb-stack-sm scrollbar-hide -mx-container-padding px-container-padding"><button (click)="selectFilterChip($event)" class="filter-chip bg-surface border border-outline-variant text-on-surface-variant font-label-lg text-label-lg px-4 py-1.5 rounded-full whitespace-nowrap hover:border-primary transition-all">Under 500</button><button (click)="selectFilterChip($event)" class="filter-chip bg-surface border border-outline-variant text-on-surface-variant font-label-lg text-label-lg px-4 py-1.5 rounded-full whitespace-nowrap hover:border-primary transition-all">500-1500</button><button (click)="selectFilterChip($event)" class="filter-chip bg-surface border border-outline-variant text-on-surface-variant font-label-lg text-label-lg px-4 py-1.5 rounded-full whitespace-nowrap hover:border-primary transition-all">1500-3000</button><button (click)="selectFilterChip($event)" class="filter-chip bg-surface border border-outline-variant text-on-surface-variant font-label-lg text-label-lg px-4 py-1.5 rounded-full whitespace-nowrap hover:border-primary transition-all">3000+</button></div>

</div>

<span class="material-symbols-outlined text-[20px]">directions</span>
</button>
<button (click)="toggleSave($event)" aria-label="Save restaurant" class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-1">
