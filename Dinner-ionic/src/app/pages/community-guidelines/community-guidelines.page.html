<app-header title="Community Guidelines" (back)="goBack()"></app-header>
<main class="flex-grow px-container-padding pb-32">

<section class="py-stack-lg flex flex-col items-center text-center">
<div class="w-20 h-20 rounded-full bg-secondary-container flex items-center justify-center mb-stack-md text-primary">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">handshake</span>
</div>
<p class="font-title-lg text-title-lg text-on-surface mb-unit">{{ content().intro.split('\n')[0] }}</p>
<p class="font-body-md text-body-md text-on-surface-variant">{{ content().intro.split('\n').slice(1).join(' ') }}</p>
</section>

<div class="flex flex-col gap-stack-md">

<ng-container *ngFor="let section of content().sections; let i = index">
<div *ngIf="!isWarning(section.heading)" class="bg-surface rounded-2xl p-stack-md shadow-[0_4px_16px_0_rgba(0,0,0,0.04)] border border-surface-variant/50 flex gap-stack-md items-start">
<div class="bg-secondary-container/50 p-3 rounded-full text-primary shrink-0">
<span class="material-symbols-outlined">{{ iconForSection(section, i) }}</span>
</div>
<div>
<h3 class="font-title-lg text-[18px] leading-6 font-semibold text-on-surface mb-1">{{ section.heading }}</h3>
<app-policy-body [body]="section.body" textClass="font-body-md text-body-md text-on-surface-variant"></app-policy-body>
</div>
</div>

<div *ngIf="isWarning(section.heading)" class="mt-stack-md bg-error-container/20 rounded-2xl p-stack-md border border-error/30 flex gap-stack-md items-start">
<div class="bg-error/10 p-3 rounded-full text-error shrink-0">
<span class="material-symbols-outlined">{{ iconForSection(section, i) }}</span>
</div>
<div>
<h3 class="font-title-lg text-[18px] leading-6 font-semibold text-error mb-1">{{ section.heading }}</h3>
<app-policy-body [body]="section.body" textClass="font-body-md text-body-md text-on-surface-variant"></app-policy-body>
</div>
</div>
</ng-container>
</div>
</main>

<div class="fixed bottom-0 w-full max-w-md bg-surface-container-low/90 backdrop-blur-md pt-stack-md pb-container-padding px-container-padding border-t border-surface-variant/30 rounded-t-2xl z-50">
<button (click)="goBack()" class="w-full bg-primary-container text-on-primary rounded-full py-4 font-title-lg text-title-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all">
            I Agree &amp; Continue
        </button>
<div class="mt-stack-md flex justify-center gap-4 font-label-sm text-label-sm text-on-surface-variant">
<a (click)="go('/report-users')" class="underline decoration-outline-variant hover:text-primary transition-colors">Report a safety concern</a>
<span>•</span>
<a (click)="go('/full-community-policy')" class="underline decoration-outline-variant hover:text-primary transition-colors">View full policy</a>
</div>
</div>
