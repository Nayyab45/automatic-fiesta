<header class="sticky top-0 z-40 bg-surface flex justify-between items-center w-full px-container-padding py-stack-md">
<button (click)="goBack()" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Discover People</h1>
<button (click)="go('/search-filter')" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-primary relative" id="filterBtn">
<span class="material-symbols-outlined">tune</span>
<span class="absolute top-2 right-2 w-2.5 h-2.5 bg-error rounded-full border-2 border-surface"></span>
</button>
</header>

<main class="flex-1 overflow-y-auto px-container-padding pb-[100px] flex flex-col gap-stack-lg">

<section class="flex flex-col gap-stack-sm">
<div class="relative w-full h-12">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full h-full pl-12 pr-4 bg-surface-container-lowest border-b border-outline-variant focus:border-primary-container focus:ring-0 outline-none transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline bg-transparent" placeholder="Search by name or interest" type="text"/>
</div>

<div class="flex overflow-x-auto hide-scrollbar gap-unit py-unit -mx-container-padding px-container-padding">
<button (click)="go('/search-filter')" class="flex items-center gap-2 px-4 py-2 rounded-full border-1.5 border-primary bg-secondary-container bg-opacity-20 text-on-secondary-container font-label-lg text-label-lg whitespace-nowrap flex-shrink-0 transition-colors">
                    Age: 25-35
                    <span class="material-symbols-outlined text-[18px]">keyboard_arrow_down</span>
</button>
<button (click)="go('/search-filter')" class="flex items-center gap-2 px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container font-label-lg text-label-lg whitespace-nowrap flex-shrink-0 transition-colors">
                    Interests
                    <span class="material-symbols-outlined text-[18px]">keyboard_arrow_down</span>
</button>
<button (click)="go('/search-filter')" class="flex items-center gap-2 px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container font-label-lg text-label-lg whitespace-nowrap flex-shrink-0 transition-colors">
                    Cuisine
                    <span class="material-symbols-outlined text-[18px]">keyboard_arrow_down</span>
</button>
<button (click)="go('/search-filter')" class="flex items-center gap-2 px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container font-label-lg text-label-lg whitespace-nowrap flex-shrink-0 transition-colors">
                    Distance: &lt;5km
                    <span class="material-symbols-outlined text-[18px]">keyboard_arrow_down</span>
</button>
</div>
</section>

<p *ngIf="loading()" class="font-body-md text-body-md text-on-surface-variant text-center py-section-gap">Finding people nearby…</p>
<p *ngIf="!loading() && people().length === 0" class="font-body-md text-body-md text-on-surface-variant text-center py-section-gap">No one else here yet.</p>

<section *ngIf="!loading() && people().length > 0" class="flex flex-col gap-stack-md">

<div *ngFor="let person of people()" class="bg-surface-container-lowest rounded-xl p-stack-md shadow-[0_4px_16px_rgba(0,0,0,0.04)] border border-surface-container-low flex flex-col gap-stack-md relative overflow-hidden">
<div class="flex items-start gap-4">
<div class="w-16 h-16 rounded-full bg-tertiary-container/30 text-tertiary flex items-center justify-center font-headline-md text-headline-md border-[0.5px] border-outline-variant shadow-sm shrink-0">{{ person.name.charAt(0) }}</div>
<div class="flex-1 flex flex-col justify-center">
<div class="flex justify-between items-center">
<h3 class="font-headline-md text-headline-md text-on-background">{{ person.name }}{{ person.age ? ', ' + person.age : '' }}</h3>
<span *ngIf="person.city" class="font-label-sm text-label-sm text-outline flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">place</span>
                                {{ person.city }}
                            </span>
</div>
<p *ngIf="person.bio" class="font-body-md text-body-md text-on-surface-variant mt-1">{{ person.bio }}</p>
</div>
</div>
<div class="flex flex-wrap gap-2" *ngIf="person.interests.length > 0">
<span *ngFor="let interest of person.interests" class="px-3 py-1 rounded-full bg-tertiary-container bg-opacity-10 text-tertiary font-label-sm text-label-sm border-[0.5px] border-tertiary-container">{{ interest.name }}</span>
</div>
<div class="flex items-center justify-end gap-2 mt-2 pt-4 border-t-[0.5px] border-outline-variant">
<button (click)="message(person)" aria-label="Message" class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-10 h-10 rounded-full border border-outline-variant hover:border-primary">
<span class="material-symbols-outlined text-[18px]">chat</span>
</button>
<button (click)="go('/ai-matching')" class="bg-primary-container text-on-primary rounded-full px-6 py-2 font-label-lg text-label-lg hover:opacity-90 transition-opacity flex items-center gap-2">
                        Invite to Meal
                        <span class="material-symbols-outlined text-[16px]">restaurant</span>
</button>
</div>
</div>
</section>
</main>

<app-bottom-nav active="discover"></app-bottom-nav>

<div class="fixed inset-0 bg-on-background/20 backdrop-blur-[5px] z-[60] flex flex-col justify-end opacity-0 pointer-events-none transition-opacity duration-300" id="filterOverlay">
<div class="bg-surface rounded-t-[24px] shadow-[0_-8px_32px_rgba(0,0,0,0.08)] transform translate-y-full transition-transform duration-300 max-h-[751px] flex flex-col" id="filterSheet">
<div class="flex justify-center pt-4 pb-2">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<div class="px-container-padding py-stack-md flex justify-between items-center border-b-[0.5px] border-outline-variant">
<h2 class="font-headline-md text-headline-md text-on-background">Filters</h2>
<button (click)="goBack()" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors" id="closeFilterBtn">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="overflow-y-auto px-container-padding py-stack-lg flex flex-col gap-section-gap">

<div class="flex flex-col gap-stack-md">
<div class="flex justify-between items-center">
<h3 class="font-title-lg text-title-lg text-on-background">Age Range</h3>
<span class="font-label-lg text-label-lg text-primary">25 - 40</span>
</div>

<div class="relative w-full h-8 flex items-center">
<div class="absolute w-full h-1 bg-surface-container-highest rounded-full"></div>
<div class="absolute w-[40%] left-[20%] h-1.5 bg-primary rounded-full"></div>
<div class="absolute left-[20%] w-6 h-6 bg-primary-container rounded-full border-2 border-surface shadow-sm transform -translate-x-1/2 cursor-grab"></div>
<div class="absolute left-[60%] w-6 h-6 bg-primary-container rounded-full border-2 border-surface shadow-sm transform -translate-x-1/2 cursor-grab"></div>
</div>
</div>

<div class="flex flex-col gap-stack-md">
<h3 class="font-title-lg text-title-lg text-on-background">Interests</h3>
<div class="flex flex-wrap gap-3">
<button (click)="toggleChip($event)" class="chip chip-selected px-4 py-2 rounded-full border-1.5 border-primary bg-secondary-container bg-opacity-20 text-on-secondary-container font-label-lg text-label-lg transition-colors">Foodie</button>
<button (click)="toggleChip($event)" class="chip px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-lg text-label-lg transition-colors">Coffee Lover</button>
<button (click)="toggleChip($event)" class="chip chip-selected px-4 py-2 rounded-full border-1.5 border-primary bg-secondary-container bg-opacity-20 text-on-secondary-container font-label-lg text-label-lg transition-colors">Live Music</button>
<button (click)="toggleChip($event)" class="chip px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-lg text-label-lg transition-colors">Fine Dining</button>
<button (click)="toggleChip($event)" class="chip px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-lg text-label-lg transition-colors">Street Food</button>
</div>
</div>

<div class="flex flex-col gap-stack-md pb-stack-lg">
<div class="flex justify-between items-center">
<h3 class="font-title-lg text-title-lg text-on-background">Maximum Distance</h3>
<span class="font-label-lg text-label-lg text-primary">10 km</span>
</div>

<div class="relative w-full h-8 flex items-center">
<div class="absolute w-full h-1 bg-surface-container-highest rounded-full"></div>
<div class="absolute w-[30%] left-0 h-1.5 bg-primary rounded-full"></div>
<div class="absolute left-[30%] w-6 h-6 bg-primary-container rounded-full border-2 border-surface shadow-sm transform -translate-x-1/2 cursor-grab"></div>
</div>
</div>
</div>
<div class="p-container-padding border-t-[0.5px] border-outline-variant bg-surface pb-safe mt-auto">
<button (click)="goBack()" class="w-full bg-primary-container text-on-primary py-4 rounded-lg font-title-lg text-title-lg hover:opacity-90 transition-opacity flex justify-center items-center gap-2 shadow-sm">
                    Apply Filters
                </button>
</div>
</div>
</div>
