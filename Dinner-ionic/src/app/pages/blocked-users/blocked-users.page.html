<app-header title="Blocked Users" (back)="goBack()"></app-header>
<main class="flex-1 overflow-y-auto px-container-padding py-stack-md flex flex-col gap-stack-lg">

<section class="text-center px-4">
<p class="font-body-md text-body-md text-on-surface-variant">
                People you've blocked can't see your profile or contact you.
            </p>
</section>

<p *ngIf="loading()" class="text-center py-section-gap font-body-md text-body-md text-on-surface-variant">Loading…</p>

<ul class="flex flex-col w-full" *ngIf="!loading() && blocked().length > 0">
<li *ngFor="let user of blocked()" class="flex items-center justify-between py-stack-md border-b border-outline-variant/30">
<div class="flex items-center gap-gutter">
<img *ngIf="user.photoUrl" [alt]="user.name" class="w-12 h-12 rounded-full object-cover border border-outline-variant/30" [src]="user.photoUrl"/>
<div *ngIf="!user.photoUrl" class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center border border-outline-variant/30">
<span class="material-symbols-outlined text-on-surface-variant fill-icon">person</span>
</div>
<div class="flex flex-col gap-unit">
<span class="font-title-lg text-title-lg text-on-surface leading-tight text-[16px]">{{ user.name }}</span>
<span class="font-body-md text-body-md text-on-surface-variant text-[13px]">Blocked on {{ user.createdAt | date: 'mediumDate' }}</span>
</div>
</div>
<button (click)="unblock(user)" class="interactive-element px-4 py-2 rounded-full border border-primary-container text-on-surface font-label-lg text-label-lg bg-transparent hover:bg-surface-variant/50">
                    Unblock
                </button>
</li>
</ul>

<div *ngIf="!loading() && blocked().length === 0" class="flex flex-col items-center justify-center text-center py-section-gap h-64">
<div class="w-20 h-20 rounded-full bg-secondary-container/30 flex items-center justify-center mb-stack-md">
<span class="material-symbols-outlined text-[40px] text-primary-container">how_to_reg</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-stack-sm text-[20px]">You haven't blocked anyone</h3>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[250px]">
                When you block someone, they will appear here.
            </p>
</div>
</main>
