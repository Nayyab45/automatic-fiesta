<main class="min-h-screen relative flex flex-col items-center justify-center p-container-padding overflow-hidden">

<div class="absolute inset-0 z-0 bg-cover bg-center opacity-40 mix-blend-multiply" data-alt="A highly blurred, soft-focus photograph of a high-end restaurant interior at golden hour. Warm light cascades across linen tables. The aesthetic is extremely minimalist, utilizing soft cream and muted gold tones to create a luxurious, physical paper-like texture." style="background-image: url('assets/images/login.jpg')">
</div>

<div class="absolute inset-0 z-0 bg-gradient-to-b from-surface/80 to-surface backdrop-blur-[2px]"></div>

<div class="relative z-10 w-full max-w-[420px] flex flex-col items-center">

<header class="flex flex-col items-center text-center gap-stack-sm mb-stack-lg w-full">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">What Should We Eat?</h1>
</header>

<div class="w-full bg-surface rounded-xl p-8 sm:p-10 shadow-[0_4px_16px_rgba(0,0,0,0.04)] border-[0.5px] border-outline-variant/40 flex flex-col">

<div class="flex flex-col items-center text-center gap-unit mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your dining journey.</p>
</div>

<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-stack-md w-full">

@if (errorMessage()) {
<p class="font-body-md text-body-md text-error" role="alert">{{ errorMessage() }}</p>
}

<div class="flex flex-col gap-unit group">
<label class="font-label-sm text-label-sm text-on-surface-variant group-focus-within:text-primary transition-colors" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline-variant group-focus-within:text-primary transition-colors" style="font-size: 20px;">mail</span>
<input formControlName="email" class="w-full h-12 bg-transparent border-0 border-b-[1.5px] border-outline-variant focus:border-primary focus:ring-0 pl-8 pr-2 font-body-lg text-body-lg text-on-surface transition-colors placeholder:text-outline-variant/50" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>

<div class="flex flex-col gap-unit group mt-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant group-focus-within:text-primary transition-colors" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline-variant group-focus-within:text-primary transition-colors" style="font-size: 20px;">lock</span>
<input formControlName="password" [type]="passwordVisible ? 'text' : 'password'" class="w-full h-12 bg-transparent border-0 border-b-[1.5px] border-outline-variant focus:border-primary focus:ring-0 pl-8 pr-10 font-body-lg text-body-lg text-on-surface transition-colors placeholder:text-outline-variant/50" id="password" placeholder="••••••••"/>
<button (click)="togglePasswordVisibility()" aria-label="Toggle password visibility" class="absolute right-0 text-outline-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">{{ passwordVisible ? 'visibility' : 'visibility_off' }}</span>
</button>
</div>
</div>

<div class="flex justify-end mt-unit">
<a (click)="go('/reset-password')" class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors py-2" role="link" tabindex="0" (keydown.enter)="$event.target === $event.currentTarget && go('/reset-password')">Forgot Password?</a>
</div>

<button [disabled]="submitting()" class="w-full h-12 mt-stack-sm bg-primary-container text-on-primary-container font-label-lg text-label-lg rounded-full flex items-center justify-center gap-unit hover:bg-primary hover:text-on-primary transition-all duration-300 active:scale-[0.98] shadow-sm disabled:opacity-60" type="submit">
<span class="">{{ submitting() ? 'Signing In…' : 'Sign In' }}</span>
<span class="material-symbols-outlined" style="font-size: 18px;">arrow_right_alt</span>
</button>
</form>

<div class="flex items-center gap-gutter my-stack-lg w-full">
<div class="h-[0.5px] bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Or continue with</span>
<div class="h-[0.5px] bg-outline-variant flex-1"></div>
</div>

<div class="flex gap-stack-md w-full">
<button (click)="continueWithGoogle()" [disabled]="submitting()" aria-label="Continue with Google" class="w-full h-12 border-[1.5px] border-outline-variant rounded-full flex items-center justify-center gap-stack-sm hover:border-primary hover:bg-surface-container-low transition-all duration-200 active:scale-[0.98] disabled:opacity-50" type="button">
<svg class="w-5 h-5 text-on-surface" fill="currentColor" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</button>
</div>
</div>

<div class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account?
                    <a (click)="go('/signup')" class="text-primary font-label-lg text-label-lg hover:text-primary-fixed-dim hover:underline underline-offset-4 transition-colors ml-unit" role="link" tabindex="0" (keydown.enter)="$event.target === $event.currentTarget && go('/signup')">Sign Up</a>
</p>
</div>
</div>
</main>
