<header class="sticky top-0 z-40 w-full bg-surface dark:bg-surface-dim h-16">
<div class="flex justify-between items-center px-container-padding h-full w-full max-w-7xl mx-auto">
<button (click)="goBack()" aria-label="Go back" class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-200 flex items-center justify-center p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary font-bold tracking-tight text-center flex-grow">Manage Account</h1>
<div class="w-10"></div> 
</div>
</header>

<main class="flex-grow pb-section-gap px-container-padding max-w-md mx-auto w-full flex flex-col gap-section-gap">

<section class="flex flex-col items-center gap-stack-md mt-4">
<div class="relative group">
<div (click)="avatarFileInput.click()" class="w-24 h-24 rounded-full overflow-hidden bg-surface-container-high card-inner-stroke flex items-center justify-center relative cursor-pointer">
<img alt="Profile Picture" class="w-full h-full object-cover" [src]="avatarUrl || 'https://lh3.googleusercontent.com/aida-public/AB6AXuB4uxNZAJEw7_1yGTEV0RSKxme2NthaZ8fZwGWl6eqx9xs0t0mi305ULTJd1Lesg5UzeSJGXJ4TYWir_K1sam-IX-xneaMkHrubmPpcmRlilQ68yfr41Mwcd6ZdauRcThQUdWhCwTxKy4H8ampJf8ksFYknl7poolKNxBoph1P390MXFYsfNtMiG3SWdw_v3zs_p78FTZIUwzl_68csR_y3Pp3_4HjDzKn4XVs2AwjTRLN77d5KtL3t'"/>
<div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
<span class="material-symbols-outlined text-white" data-icon="edit">edit</span>
</div>
</div>
<button (click)="avatarFileInput.click()" class="absolute bottom-0 right-0 bg-primary-container text-on-primary-container p-2 rounded-full shadow-sm hover:opacity-90 active:scale-95 transition-all border border-background">
<span class="material-symbols-outlined text-[16px]" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
<input #avatarFileInput (change)="onAvatarSelected($event)" accept="image/*" class="sr-only" type="file"/>
</div>
<div class="text-center">
<h2 class="font-title-lg text-title-lg text-on-surface">{{ fullName }}</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-unit">{{ email }}</p>
<div class="mt-stack-sm inline-flex items-center gap-1 bg-[#8A9278]/10 px-3 py-1 rounded-full border border-[#8A9278]/20">
<span class="material-symbols-outlined text-[14px] text-[#8A9278]" data-icon="workspace_premium" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
<span class="font-label-lg text-label-lg text-[#8A9278]">Gold Member</span>
</div>
</div>
</section>

<section class="flex flex-col gap-stack-md">
<h3 class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider">Personal Details</h3>
<div class="bg-surface rounded-xl ambient-shadow card-inner-stroke overflow-hidden flex flex-col">

<button (click)="editFullName()" class="w-full flex items-center justify-between p-stack-md border-b-[0.5px] border-[#E8D8B8] hover:bg-surface-container-low interaction-stroke transition-all text-left group">
<div class="flex items-center gap-gutter">
<span class="material-symbols-outlined text-primary/70" data-icon="person_outline">person</span>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Full Name</p>
<p class="font-body-lg text-body-lg text-on-surface mt-unit group-hover:text-primary transition-colors">{{ fullName }}</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>

<button (click)="editEmail()" class="w-full flex items-center justify-between p-stack-md border-b-[0.5px] border-[#E8D8B8] hover:bg-surface-container-low interaction-stroke transition-all text-left group">
<div class="flex items-center gap-gutter">
<span class="material-symbols-outlined text-primary/70" data-icon="mail">mail</span>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Email Address</p>
<p class="font-body-lg text-body-lg text-on-surface mt-unit group-hover:text-primary transition-colors">{{ email }}</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>

<button (click)="editPhone()" class="w-full flex items-center justify-between p-stack-md hover:bg-surface-container-low interaction-stroke transition-all text-left group">
<div class="flex items-center gap-gutter">
<span class="material-symbols-outlined text-primary/70" data-icon="call">call</span>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Phone Number</p>
<p class="font-body-lg text-body-lg text-on-surface mt-unit group-hover:text-primary transition-colors">{{ phone }}</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>

<section class="flex flex-col gap-stack-md">
<h3 class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider">Billing</h3>
<div class="bg-surface rounded-xl ambient-shadow card-inner-stroke overflow-hidden flex flex-col">
<button (click)="go('/payment-methods')" class="w-full flex items-center justify-between p-stack-md hover:bg-surface-container-low interaction-stroke transition-all text-left group">
<div class="flex items-center gap-gutter">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="credit_card">credit_card</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">Payment Methods</p>
<p class="font-body-md text-body-md text-on-surface-variant mt-unit">Manage saved cards</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>

<section class="flex flex-col gap-stack-md">
<h3 class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider">Security</h3>
<div class="bg-surface rounded-xl ambient-shadow card-inner-stroke overflow-hidden flex flex-col">

<button (click)="go('/reset-password')" class="w-full flex items-center justify-between p-stack-md border-b-[0.5px] border-[#E8D8B8] hover:bg-surface-container-low interaction-stroke transition-all text-left group">
<div class="flex items-center gap-gutter">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="lock">lock</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">Change Password</p>
<p class="font-body-md text-body-md text-on-surface-variant mt-unit">Updated 2 months ago</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>

<button (click)="toggleTwoFactor()" class="w-full flex items-center justify-between p-stack-md hover:bg-surface-container-low interaction-stroke transition-all text-left group">
<div class="flex items-center gap-gutter">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="verified_user">verified_user</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">Two-Factor Authentication</p>
<p *ngIf="twoFactorEnabled" class="font-body-md text-body-md text-[#8A9278] mt-unit flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span> Enabled
                            </p>
<p *ngIf="!twoFactorEnabled" class="font-body-md text-body-md text-on-surface-variant mt-unit flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="cancel">cancel</span> Disabled
                            </p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>

<section class="flex flex-col gap-stack-md pt-stack-lg border-t border-outline-variant/30">
<button (click)="go('/login')" class="w-full py-4 px-6 rounded-xl border border-[#E8D8B8] text-[#1c1b1a] font-title-lg text-title-lg flex items-center justify-center gap-gutter hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
                Log Out
            </button>
<button (click)="showDeleteConfirm = true" class="w-full py-4 px-6 rounded-xl border border-error/20 text-error font-title-lg text-title-lg flex items-center justify-center gap-gutter hover:bg-error/5 transition-colors">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
                Delete Account
            </button>
</section>
</main>

<app-confirm-dialog
  *ngIf="showDeleteConfirm"
  title="Delete your account?"
  message="This permanently deletes your profile, tables, and dining history. This action cannot be undone."
  confirmLabel="Delete Account"
  [destructive]="true"
  (cancelled)="showDeleteConfirm = false"
  (confirm)="confirmDeleteAccount()"
></app-confirm-dialog>
