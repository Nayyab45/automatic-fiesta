<header class="sticky top-0 z-40 bg-surface dark:bg-surface w-full px-container-padding pt-safe pb-stack-md flex justify-between items-center transition-all duration-300">
<div (click)="go('/select-location')" class="flex items-center gap-stack-sm hover:opacity-80 transition-opacity cursor-pointer" role="button" tabindex="0" (keydown.enter)="$event.target === $event.currentTarget && go('/select-location')" (keydown.space)="$event.target === $event.currentTarget && $event.preventDefault(); $event.target === $event.currentTarget && go('/select-location')">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">place</span>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim">{{ cityService.label() }}</h1>
</div>
<div class="hover:opacity-80 transition-opacity cursor-pointer">
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant">
<app-user-avatar class="w-full h-full"></app-user-avatar>
</div>
</div>
</header>
<main class="max-w-4xl mx-auto w-full px-container-padding py-stack-lg pb-32">

<form (ngSubmit)="showResults()" class="mb-section-gap relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">search</span>
</div>
<input [(ngModel)]="searchQuery" name="searchQuery" enterkeyhint="search" inputmode="search" autocomplete="off" (keyup.enter)="showResults()" class="w-full bg-surface border-b border-outline-variant focus:border-primary-container focus:ring-0 pl-12 pr-4 py-4 font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant transition-colors outline-none rounded-t-sm shadow-[0_4px_16px_rgba(0,0,0,0.04)]" placeholder="Search Pakistani restaurants, dishes or people" type="text"/>
<button type="submit" class="sr-only" aria-hidden="true" tabindex="-1">Search</button>
</form>

<div class="grid grid-cols-1 md:grid-cols-12 gap-section-gap">

<div class="md:col-span-8 space-y-section-gap">

<section class="space-y-stack-md border-b border-outline-variant pb-stack-lg" *ngIf="cuisines().length">
<h2 class="font-title-lg text-title-lg text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container">restaurant</span>
                        Regional Cuisine
                    </h2>
<div class="flex flex-wrap gap-stack-sm">
<button *ngFor="let cuisine of cuisines()" (click)="toggleCuisine(cuisine)" [class.selected]="selectedCuisines.has(cuisine)" class="filter-chip px-4 py-2 rounded-full border border-outline-variant text-on-surface bg-surface hover:border-primary-container">{{ cuisine }}</button>
</div>
</section>
</div>

<div class="md:col-span-4 space-y-section-gap">

<section class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface">Price Tier</h2>
<div class="flex rounded-md border border-outline-variant overflow-hidden">
<button *ngFor="let tier of priceTiers; let i = index" (click)="selectPriceTier(i)" [class.bg-surface-container]="priceTierIndex === i" [class.bg-surface]="priceTierIndex !== i" [class.border-b-2]="priceTierIndex === i" [class.border-primary-container]="priceTierIndex === i" class="flex-1 py-2 text-on-surface border-r border-outline-variant last:border-r-0 hover:bg-surface-container transition-colors text-center font-label-lg">{{ tier }}</button>
</div>
</section>

<section class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface">Minimum Rating</h2>
<div class="flex items-center gap-2">
<button *ngFor="let star of stars" (click)="setRating(star)" [class.text-primary-container]="ratingValue !== null && star <= ratingValue" [class.text-outline-variant]="ratingValue === null || star > ratingValue"><span class="material-symbols-outlined" [style.font-variation-settings]="ratingValue !== null && star <= ratingValue ? '\'FILL\' 1' : '\'FILL\' 0'">star</span></button>
<span class="ml-2 font-label-lg text-on-surface-variant">{{ ratingValue !== null ? ratingValue + '.0+' : 'Any' }}</span>
</div>
</section>

<section class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface">Available Seats</h2>
<div class="flex items-center justify-between border-b border-outline-variant pb-2">
<button (click)="decrementGuests()" class="w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center text-on-surface hover:border-primary-container"><span class="material-symbols-outlined text-sm">remove</span></button>
<span class="font-title-lg text-on-surface">{{ guestCount }} Guest{{ guestCount === 1 ? '' : 's' }}</span>
<button (click)="incrementGuests()" class="w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center text-on-surface hover:border-primary-container"><span class="material-symbols-outlined text-sm">add</span></button>
</div>
</section>

<div class="pt-section-gap flex flex-col gap-stack-md">
<button (click)="showResults()" class="w-full bg-primary-container text-on-primary py-3 rounded-md font-label-lg uppercase tracking-wider hover:opacity-90 transition-opacity flex justify-center items-center gap-2">
                        Show Results
                    </button>
<button (click)="resetFilters()" class="w-full border border-outline-variant text-on-surface py-3 rounded-md font-label-lg uppercase tracking-wider hover:bg-surface-container transition-colors">
                        Reset Filters
                    </button>
</div>
</div>
</div>
</main>

<app-bottom-nav active="discover"></app-bottom-nav>
