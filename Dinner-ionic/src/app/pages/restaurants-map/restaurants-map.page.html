<header class="absolute top-0 left-0 right-0 z-20 px-4 py-3 flex justify-between items-center bg-surface/80 backdrop-blur-md border-b border-outline-variant/30">
<button (click)="goBack()" aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface shadow-sm hover:bg-surface-container transition-colors border border-outline-variant">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="text-center">
<h1 class="font-headline-md text-headline-md text-on-surface">Restaurants Map</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant">{{ cityService.label() }}</p>
</div>
<div class="w-10 h-10"></div>
</header>

<main class="absolute inset-0 w-full h-full">
<div #mapContainer class="absolute inset-0 w-full h-full bg-surface-container-low"></div>

<p *ngIf="loading()" class="absolute inset-0 flex items-center justify-center px-8 text-center font-body-md text-body-md text-on-surface-variant bg-surface-container-low pointer-events-none">
Finding real nearby restaurants… this can take a few seconds the first time for a new city.
</p>

<p *ngIf="!loading() && restaurants().length === 0" class="absolute inset-0 flex items-center justify-center px-8 text-center font-body-md text-body-md text-on-surface-variant bg-surface-container-low pointer-events-none">
No restaurants found in {{ cityService.current() }} yet.
</p>

<p *ngIf="!loading() && restaurants().length > 0 && !hasCoords()" class="absolute inset-0 flex items-center justify-center px-8 text-center font-body-md text-body-md text-on-surface-variant bg-surface-container-low pointer-events-none">
None of {{ cityService.current() }}'s restaurants have map coordinates yet.
</p>
</main>
