<header class="flex items-center justify-between px-container-padding py-stack-md">
<button (click)="goBack()" class="p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md text-primary font-bold">Tables</div>
<div class="w-10"></div> 
</header>
<main class="px-container-padding mt-stack-md max-w-2xl mx-auto">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-section-gap">
            Who's joining the table?
        </h1>

<p *ngIf="loading()" class="font-body-md text-body-md text-on-surface-variant text-center py-section-gap">Loading guests…</p>

<div *ngIf="!loading()" class="flex flex-col gap-stack-lg">

<div *ngFor="let guest of guests()" class="glass-card rounded-xl p-gutter flex gap-gutter items-center">
<div class="w-16 h-16 rounded-full bg-tertiary-container/30 text-tertiary flex items-center justify-center font-headline-md text-headline-md border border-secondary-container shrink-0">{{ guest.name.charAt(0) }}</div>
<div class="flex-1">
<div class="flex justify-between items-baseline mb-unit">
<h2 class="font-title-lg text-title-lg text-on-surface">{{ guest.name }}</h2>
<span *ngIf="guest.isHost" class="font-label-sm text-label-sm text-primary uppercase">Host</span>
</div>
</div>
</div>
</div>

<p *ngIf="!loading() && guests().length === 0" class="font-body-md text-body-md text-on-surface-variant text-center py-section-gap">No guests yet.</p>
</main>
