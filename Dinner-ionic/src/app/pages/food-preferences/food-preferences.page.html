<header class="pt-16 pb-stack-lg px-container-padding text-center md:max-w-md md:mx-auto">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-stack-sm">What do you love to eat?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Choose your Pakistani food preferences.</p>
</header>

<main class="flex-grow min-h-0 overflow-y-auto px-container-padding pb-32 md:max-w-md md:mx-auto md:w-full">
<form id="preferences-form">

<section class="mb-section-gap">
<h2 class="font-title-lg text-title-lg text-on-surface mb-stack-md flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">restaurant_menu</span>
                        Pakistani Favorites
                    </h2>
<div class="flex flex-wrap gap-2">
<button *ngFor="let food of pakistaniFavorites" (click)="toggleChip(food)" [class.chip-selected]="isSelected(food)" [class.chip-default]="!isSelected(food)" class="font-body-md text-body-md px-4 py-2 rounded-full cursor-pointer select-none" type="button">{{ food }}</button>
</div>
</section>

<section class="mb-section-gap">
<h2 class="font-title-lg text-title-lg text-on-surface mb-stack-md flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">public</span>
                        Regional
                    </h2>
<div class="flex flex-wrap gap-2">
<button *ngFor="let food of regional" (click)="toggleChip(food)" [class.chip-selected]="isSelected(food)" [class.chip-default]="!isSelected(food)" class="font-body-md text-body-md px-4 py-2 rounded-full cursor-pointer select-none" type="button">{{ food }}</button>
</div>
</section>

<section class="mb-section-gap">
<h2 class="font-title-lg text-title-lg text-on-surface mb-stack-md flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">fastfood</span>
                        Street Food
                    </h2>
<div class="flex flex-wrap gap-2">
<button *ngFor="let food of streetFood" (click)="toggleChip(food)" [class.chip-selected]="isSelected(food)" [class.chip-default]="!isSelected(food)" class="font-body-md text-body-md px-4 py-2 rounded-full cursor-pointer select-none" type="button">{{ food }}</button>
</div>
</section>

<section class="mb-section-gap">
<h2 class="font-title-lg text-title-lg text-on-surface mb-stack-md flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">cake</span>
                        Desserts
                    </h2>
<div class="flex flex-wrap gap-2">
<button *ngFor="let food of desserts" (click)="toggleChip(food)" [class.chip-selected]="isSelected(food)" [class.chip-default]="!isSelected(food)" class="font-body-md text-body-md px-4 py-2 rounded-full cursor-pointer select-none" type="button">{{ food }}</button>
</div>
</section>

<section class="mb-section-gap">
<h2 class="font-title-lg text-title-lg text-on-surface mb-stack-md flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">local_cafe</span>
                        Drinks
                    </h2>
<div class="flex flex-wrap gap-2">
<button *ngFor="let food of drinks" (click)="toggleChip(food)" [class.chip-selected]="isSelected(food)" [class.chip-default]="!isSelected(food)" class="font-body-md text-body-md px-4 py-2 rounded-full cursor-pointer select-none" type="button">{{ food }}</button>
</div>
</section>
</form>
</main>

<div class="fixed bottom-0 left-0 w-full md:max-w-md md:left-1/2 md:-translate-x-1/2 bg-surface border-t border-outline-variant/30 px-container-padding py-stack-md pb-8 z-50">
<button (click)="continue()" [disabled]="submitting()" class="w-full bg-primary-container text-on-primary font-title-lg text-title-lg py-4 rounded-lg shadow-sm hover:opacity-90 transition-opacity active:scale-[0.98] disabled:opacity-60" type="button">
                {{ submitting() ? 'Saving…' : 'Continue' }}
            </button>
</div>
