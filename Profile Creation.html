<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Profile Creation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {
          darkMode: "class",
          theme: {

                      "surface-container-low": "#f7f3ef",
                      "inverse-surface": "#31302e",
                      "tertiary": "#5a614a",
                      "secondary-container": "#f1e1c0",
                      "secondary-fixed": "#f1e1c0",
                      "on-primary": "#ffffff",
                      "on-error-container": "#93000a",
                      "on-secondary-fixed-variant": "#50462e",
                      "on-tertiary-fixed-variant": "#424a34",
                      "tertiary-fixed-dim": "#c2caad",
                      "on-tertiary": "#ffffff",
                      "primary-fixed-dim": "#e2c382",
                      "on-tertiary-container": "#313824",
                      "primary-fixed": "#ffdf9e",
                      "surface-variant": "#e6e2de",
                      "on-primary-fixed": "#261a00",
                      "surface-container-highest": "#e6e2de",
                      "tertiary-container": "#9aa287",
                      "surface-container": "#f1ede9",
                      "primary": "#735b25",
                      "secondary-fixed-dim": "#d4c5a6",
                      "outline": "#7e7668",
                      "surface-bright": "#fdf8f5",
                      "inverse-primary": "#e2c382",
                      "on-secondary-fixed": "#221b07",
                      "surface-dim": "#ddd9d6",
                      "primary-container": "#b89b5e",
                      "on-error": "#ffffff",
                      "background": "#fdf8f5",
                      "outline-variant": "#d0c5b5",
                      "on-surface": "#1c1b1a",
                      "surface-tint": "#735b25",
                      "on-tertiary-fixed": "#171e0b",
                      "error": "#ba1a1a",
                      "error-container": "#ffdad6",
                      "surface-container-lowest": "#ffffff",
                      "tertiary-fixed": "#dee6c8",
                      "secondary": "#695d44",
                      "surface": "#fdf8f5",
                      "on-background": "#1c1b1a",
                      "on-secondary-container": "#6f6349",
                      "on-secondary": "#ffffff",
                      "on-primary-fixed-variant": "#59440f",
                      "inverse-on-surface": "#f4f0ec"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-sm": "8px",
                      "unit": "4px",
                      "stack-md": "16px",
                      "container-padding": "24px",
                      "stack-lg": "32px",
                      "section-gap": "48px",
                      "gutter": "16px"
              },
              "fontFamily": {
                      "body-md": ["Inter"],
                      "headline-md": ["Playfair Display"],
                      "title-lg": ["Inter"],
                      "display-lg": ["Playfair Display"],
                      "body-lg": ["Inter"],
                      "headline-lg": ["Playfair Display"],
                      "label-sm": ["Inter"],
                      "label-lg": ["Inter"],
                      "headline-lg-mobile": ["Playfair Display"]
              },
              "fontSize": {
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                      "label-sm": ["10px", {"lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                      "label-lg": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-underline {
            border: none;
            border-bottom: 1px solid #E8D8B8; /* Light Champagne border */
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
            background-color: transparent;
        }
        .input-underline:focus {
            box-shadow: none;
            border-bottom-color: #b89b5e; /* Muted Gold on focus */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center">
<div class="w-full max-w-md bg-surface min-h-screen flex flex-col md:max-w-3xl md:mx-auto md:border-x md:border-surface-variant md:shadow-sm">
<!-- Header: Linear/Transactional intent, TopAppBar simplified (No Shell Navs) -->
<header class="flex justify-between items-center w-full px-container-padding py-stack-md bg-surface sticky top-0 z-10">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 -ml-2 rounded-full active:scale-95 duration-150" type="button">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex-grow"></div>
<div class="text-right">
<span class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider">Step 2 of 3</span>
</div>
</header>
<main class="flex-grow px-container-padding pb-section-gap flex flex-col gap-stack-lg mt-stack-md md:mt-stack-lg max-w-lg mx-auto w-full">
<div class="text-center md:text-left flex flex-col gap-unit">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">Tell us about yourself</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">We'll use this to personalize your dining experience.</p>
</div>
<!-- Profile Photo Upload -->
<div class="flex flex-col items-center justify-center gap-stack-sm md:items-start md:flex-row md:gap-container-padding">
<div class="relative group cursor-pointer">
<div class="w-32 h-32 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center overflow-hidden shadow-[0_4px_16px_rgba(0,0,0,0.04)] transition-all duration-300 group-hover:border-primary-container">
<span class="material-symbols-outlined text-4xl text-on-surface-variant opacity-50">person</span>
</div>
<div class="absolute bottom-0 right-0 bg-primary-container text-on-primary rounded-full p-2 shadow-sm flex items-center justify-center transform translate-x-1/4 -translate-y-1/4">
<span class="material-symbols-outlined text-xl">add_a_photo</span>
</div>
</div>
<div class="text-center md:text-left md:self-center">
<p class="font-title-lg text-title-lg text-on-surface">Profile Photo</p>
<p class="font-body-md text-body-md text-on-surface-variant">Upload a clear photo of your face.</p>
</div>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-stack-md">
<div class="flex flex-col gap-unit">
<label class="font-label-lg text-label-lg text-on-surface-variant uppercase" for="name">Full Name</label>
<input class="input-underline font-body-lg text-body-lg text-on-surface focus:ring-0" id="name" name="name" placeholder="Enter your full name" type="text" value="Ahmed Khan">
</div>
<div class="flex flex-col gap-stack-md">
<div class="flex flex-col gap-unit">
<label class="font-label-lg text-label-lg text-on-surface-variant uppercase" for="age">Age</label>
<input class="input-underline font-body-lg text-body-lg text-on-surface focus:ring-0" id="age" name="age" placeholder="e.g. 28" type="number">
</div>
<div class="flex flex-col gap-unit">
<label class="font-label-lg text-label-lg text-on-surface-variant uppercase" for="province">Province</label>
<select class="input-underline font-body-lg text-body-lg text-on-surface focus:ring-0 appearance-none bg-transparent" id="province" name="province" onchange="const citySelect = document.getElementById('city'); const province = this.value; citySelect.innerHTML = '&lt;option disabled selected value=\'\'&gt;Select City&lt;/option&gt;'; const cities = { 'punjab': ['Lahore', 'Faisalabad', 'Multan', 'Rawalpindi', 'Gujranwala'], 'sindh': ['Karachi', 'Hyderabad', 'Sukkur', 'Larkana', 'Mirpur Khas'], 'kpk': ['Peshawar', 'Mardan', 'Abbottabad', 'Swat'], 'balochistan': ['Quetta', 'Gwadar', 'Khuzdar'], 'islamabad': ['Islamabad'], 'gilgit-baltistan': ['Gilgit', 'Skardu'], 'ajk': ['Muzaffarabad', 'Mirpur', 'Rawalakot'] }; if (cities[province]) { cities[province].forEach(city =&gt; { const opt = document.createElement('option'); opt.value = city.toLowerCase().replace(/ /g, '-'); opt.textContent = city; citySelect.appendChild(opt); }); }">
<option disabled="" selected="" value="">Select Province</option>
<option value="punjab">Punjab</option>
<option value="sindh">Sindh</option>
<option value="kpk">Khyber Pakhtunkhwa</option>
<option value="balochistan">Balochistan</option>
<option value="islamabad">Islamabad Capital Territory</option>
<option value="gilgit-baltistan">Gilgit-Baltistan</option>
<option value="ajk">Azad Kashmir</option>
</select>
<div class="relative -top-8 right-2 flex justify-end pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div><div class="flex gap-container-padding">

<div class="flex flex-col gap-unit w-full">
<label class="font-label-lg text-label-lg text-on-surface-variant uppercase" for="city">City</label>
<select class="input-underline font-body-lg text-body-lg text-on-surface focus:ring-0 appearance-none bg-transparent" id="city" name="city">
<option disabled="" selected="" value="">Select City</option>
</select>
<div class="relative -top-8 right-2 flex justify-end pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
</div>
<div class="flex flex-col gap-unit -mt-4">
<label class="font-label-lg text-label-lg text-on-surface-variant uppercase" for="bio">Short Bio</label>
<textarea class="input-underline font-body-lg text-body-lg text-on-surface focus:ring-0 resize-none" id="bio" name="bio" placeholder="A brief introduction..." rows="2">Software engineer who loves late-night karahi, chai and good conversations.</textarea>
</div>
<!-- Interests / Fav Foods (Chips pattern) -->
<div class="flex flex-col gap-stack-sm mt-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant uppercase flex justify-between items-center">
                        Favorite Pakistani Foods
                        <span class="material-symbols-outlined text-sm cursor-pointer hover:text-primary">edit</span>
</label>
<div class="flex flex-wrap gap-2">
<span class="inline-flex items-center px-3 py-1 rounded-full bg-tertiary/10 text-tertiary font-label-lg text-label-lg border border-tertiary/20">
                            Karahi
                            <span class="material-symbols-outlined text-[16px] ml-1 cursor-pointer hover:text-on-surface">close</span>
</span>
<span class="inline-flex items-center px-3 py-1 rounded-full bg-tertiary/10 text-tertiary font-label-lg text-label-lg border border-tertiary/20">
                            Biryani
                            <span class="material-symbols-outlined text-[16px] ml-1 cursor-pointer hover:text-on-surface">close</span>
</span>
<span class="inline-flex items-center px-3 py-1 rounded-full bg-tertiary/10 text-tertiary font-label-lg text-label-lg border border-tertiary/20">
                            Seekh Kebab
                            <span class="material-symbols-outlined text-[16px] ml-1 cursor-pointer hover:text-on-surface">close</span>
</span>
<button class="inline-flex items-center px-3 py-1 rounded-full border border-dashed border-outline-variant text-on-surface-variant hover:border-primary hover:text-primary transition-colors font-label-lg text-label-lg" type="button">
<span class="material-symbols-outlined text-[16px] mr-1">add</span> Add More
                        </button>
</div>
</div>
</form>
<div class="mt-auto pt-stack-lg">
<button class="w-full bg-primary-container text-on-primary font-title-lg text-title-lg py-4 rounded-full shadow-[0_4px_16px_rgba(0,0,0,0.04)] hover:opacity-90 active:scale-[0.98] active:border active:border-primary-container transition-all duration-150 flex items-center justify-center gap-2" type="button">
                    Create Profile
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
</div>


</body></html>
