                        "surface-container": "#f1ede9",

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .chip-selected {
            border-color: #B89B5E !important;
            background-color: rgba(232, 216, 184, 0.2) !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary">
<!-- Header (No nav shell as this is an onboarding flow) -->
<header class="px-container-padding py-stack-md flex justify-between items-center w-full bg-surface">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 0, 'wght' 400;">arrow_back</span>
</button>
<div class="flex gap-2 items-center">
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary-container"></div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col px-container-padding pt-stack-md pb-[120px] max-w-2xl mx-auto w-full">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-stack-lg">
            Beyond food, what brings you to the table?
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-section-gap">
            Select your interests to help us connect you with like-minded individuals and curate the perfect dining atmosphere.
        </p>
<!-- Bento Grid / Chip Layout -->
<div class="flex flex-wrap gap-stack-sm mb-stack-lg" id="interests-container">
<!-- Chips generated via JS for interaction demo -->
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md px-container-padding py-stack-md border-t border-surface-variant z-50 flex justify-center pb-safe">
<button class="w-full max-w-2xl bg-primary-container text-on-primary font-label-lg text-label-lg py-4 px-6 rounded-full flex items-center justify-between hover:opacity-90 transition-opacity" id="continue-btn">
<span>Continue</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0, 'wght' 400;">arrow_forward</span>
</button>
</div>
<script>
        const interests = [
            "Technology", "Business", "Entrepreneurship", "Photography", 
            "Travel", "Books", "Fitness", "Architecture", 
            "Design", "Movies", "Music", "Art", 
            "Startups", "Cars", "Fashion", "Cooking", 
            "Coffee & Chai", "Culture"
        ];

        const container = document.getElementById('interests-container');
        let selectedCount = 0;

        interests.forEach(interest => {
            const button = document.createElement('button');
            button.className = 'font-body-md text-body-md px-6 py-3 rounded-full border border-outline-variant bg-surface text-on-surface-variant hover:bg-surface-variant transition-all duration-200 select-none';
            button.textContent = interest;
            
            button.addEventListener('click', function() {
                this.classList.toggle('chip-selected');
                this.classList.toggle('text-on-surface');
                this.classList.toggle('text-on-surface-variant');
            });

            container.appendChild(button);
        });
    </script>
</body></html>
