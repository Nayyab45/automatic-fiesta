<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset Password - What Should We Eat?</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "on-surface-variant": "#4d463a",
                        "tertiary-container": "#9aa287",
                        "surface-bright": "#fdf8f5",
                        "surface": "#fdf8f5",
                        "tertiary": "#5a614a",
                        "surface-variant": "#e6e2de",
                        "primary": "#735b25",
                        "on-surface": "#1c1b1a",
                        "on-tertiary-fixed-variant": "#424a34",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#313824",
                        "on-tertiary": "#ffffff",
                        "outline": "#7e7668",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#d4c5a6",
                        "tertiary-fixed": "#dee6c8",
                        "on-primary-fixed": "#261a00",
                        "inverse-primary": "#e2c382",
                        "on-primary-fixed-variant": "#59440f",
                        "on-error-container": "#93000a",
                        "secondary": "#695d44",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#50462e",
                        "inverse-on-surface": "#f4f0ec",
                        "on-tertiary-fixed": "#171e0b",
                        "primary-container": "#b89b5e",
                        "inverse-surface": "#31302e",
                        "on-background": "#1c1b1a",
                        "primary-fixed-dim": "#e2c382",
                        "on-primary": "#ffffff",
                        "surface-tint": "#735b25",
                        "surface-dim": "#ddd9d6",
                        "on-secondary-fixed": "#221b07",
                        "secondary-container": "#f1e1c0",
                        "on-secondary-container": "#6f6349",
                        "surface-container-low": "#f7f3ef",
                        "secondary-fixed": "#f1e1c0",
                        "surface-container-high": "#ece7e4",
                        "primary-fixed": "#ffdf9e",
                        "error-container": "#ffdad6",
                        "background": "#fdf8f5",
                        "surface-container": "#f1ede9",
                        "tertiary-fixed-dim": "#c2caad",
                        "on-primary-container": "#463300",
                        "outline-variant": "#d0c5b5",
                        "surface-container-highest": "#e6e2de"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "unit": "4px",
                        "stack-md": "16px",
                        "section-gap": "48px",
                        "container-padding": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Playfair Display"],
                        "headline-lg-mobile": ["Playfair Display"],
                        "title-lg": ["Inter"],
                        "display-lg": ["Playfair Display"],
                        "headline-lg": ["Playfair Display"]
                    },
                    "fontSize": {
                        "label-lg": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .input-focus-ring:focus-within {
            border-color: #b89b5e;
            box-shadow: 0 0 0 1px #b89b5e;
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Ambient Background Element -->
<div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-surface-container-low to-surface opacity-50 -z-10"></div>
<div class="w-full max-w-md px-container-padding flex flex-col h-full justify-between pb-section-gap pt-stack-lg relative z-10">
<!-- Header -->
<header class="flex items-center justify-start mb-section-gap">
<button aria-label="Go back" class="p-2 -ml-2 text-on-surface-variant hover:opacity-80 transition-opacity rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center text-center">
<!-- Icon / Graphic -->
<div class="w-24 h-24 mb-stack-lg bg-surface-container-highest rounded-full flex items-center justify-center shadow-sm relative overflow-hidden">
<div class="absolute inset-0 bg-primary opacity-5 mix-blend-multiply"></div>
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="lock_reset" style="font-variation-settings: 'FILL' 0;">lock_reset</span>
</div>
<!-- Typography -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-md">Forgot your password?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto mb-section-gap">
                Enter the email associated with your account and we'll send you a reset link.
            </p>
<!-- Form -->
<form class="w-full max-w-sm flex flex-col gap-stack-lg" onsubmit="event.preventDefault(); document.getElementById('success-message').classList.remove('hidden'); this.classList.add('hidden');">
<!-- Email Input -->
<div class="relative w-full input-focus-ring rounded-xl border border-surface-variant bg-surface-bright transition-all duration-200">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant opacity-70" data-icon="mail">mail</span>
</div>
<input class="w-full pl-12 pr-4 py-4 bg-transparent border-none text-on-surface font-body-lg text-body-lg focus:ring-0 placeholder:text-on-surface-variant placeholder:opacity-50 rounded-xl" id="email" name="email" placeholder="your@email.com" required="" type="email"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary py-4 rounded-xl font-label-lg text-label-lg uppercase tracking-wider shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-150 flex justify-center items-center gap-2" type="submit">
                    Send Reset Link
                    <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Success State (Hidden by default) -->
<div class="hidden w-full max-w-sm flex-col items-center gap-stack-md animate-fade-in" id="success-message">
<div class="w-16 h-16 bg-tertiary-container/20 rounded-full flex items-center justify-center mb-stack-sm">
<span class="material-symbols-outlined text-tertiary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-title-lg text-title-lg text-on-surface">Check your inbox</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center">
                    We've sent a recovery link to your email. Please check your spam folder if you don't see it.
                </p>
<button class="mt-stack-lg text-primary font-label-lg text-label-lg hover:underline transition-all" onclick="document.getElementById('success-message').classList.add('hidden'); document.querySelector('form').classList.remove('hidden');">
                    Resend Email
                </button>
</div>
</main>
<!-- Footer / Back to Login -->
<footer class="mt-auto pt-section-gap flex justify-center w-full">
<a class="inline-flex items-center gap-1 font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-colors py-2 px-4 rounded-full hover:bg-surface-container-low" href="#">
                Back to Login
            </a>
</footer>
</div>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</body></html>
