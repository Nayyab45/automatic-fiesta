<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>What Should We Eat? - Route to Bella Notte</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#8c4e32",
                        "on-primary": "#ffffff",
                        "primary-container": "#f4a482",
                        "on-primary-container": "#71381e",
                        "secondary": "#4a6458",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#c9e6d7",
                        "on-secondary-container": "#4e685c",
                        "background": "#fcf9f8",
                        "on-background": "#1b1c1c",
                        "surface": "#fcf9f8",
                        "on-surface": "#1b1c1c",
                        "surface-variant": "#e4e2e1",
                        "on-surface-variant": "#53433d",
                        "outline": "#86736c",
                        "cream-background": "#FFFDF9",
                        "soft-border": "#E8E2D9",
                        "surface-container-low": "#f6f3f2",
                        "surface-dim": "#dcd9d9"
                    },
                    "borderRadius": {
                        "3xl": "1.5xl"
                    },
                    "spacing": {
                        "stack-sm": "12px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "stack-md": "24px"
                    },
                    "fontFamily": {
                        "display": ["Playfair Display"],
                        "body": ["DM Sans"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: 'DM Sans', sans-serif;
        }
        h1, h2, .font-display {
            font-family: 'Playfair Display', serif;
        }
        .map-gradient-overlay {
            background: linear-gradient(to bottom, rgba(255,253,249,0) 0%, rgba(255,253,249,0.7) 60%, rgba(255,253,249,1) 100%);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .pulse-marker::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background-color: #8c4e32;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: -1;
        }
    </style>
</head>
<body class="bg-cream-background text-on-background antialiased h-screen w-screen overflow-hidden flex flex-col">
<!-- Top Navigation -->
<header class="absolute top-0 left-0 right-0 z-20 px-4 py-3 flex justify-between items-center bg-cream-background/80 backdrop-blur-md border-b border-soft-border/50">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-sm hover:bg-surface-variant transition-colors border border-soft-border">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="text-center">
<h1 class="text-[10px] font-bold uppercase tracking-wider text-primary">Heading to</h1>
<p class="text-lg font-display font-bold text-on-background">Bella Notte</p>
</div>
<div class="w-10 h-10"></div>
</header>
<!-- Main Map Area -->
<main class="absolute inset-0 w-full h-full">
<!-- Simulated Map Background -->
<div class="absolute inset-0 w-full h-full bg-[#f0ede9]">
<img alt="Map route to Bella Notte" class="w-full h-full object-cover opacity-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCPHYLd3fR7zOqUNPjMr7JkPwbX-ZCqk3whCO_Q4YI-Z3tdvrj0PY7-TMEVYMkykTcPHR8WhH_luptIwuMsWQU4rmFfxXFZlXcjBFVIXcdFVt7MsRFWfyHFeknrb_P7y3FrHsJHpplEQdPeTs2UdZzXQsahqWgu9nJGtl_1qvIBB20gR5-JlTL6kFuPyeKVL_4TF0_kTzmnyCBvoZ1TMscyuDrxSPOVcshS2UrmjKlmSBkdvGYBbytg">
<!-- Route Markers -->
<div class="absolute inset-0 pointer-events-none">
<!-- User Marker -->
<div class="absolute bottom-[35%] left-[30%] w-6 h-6 rounded-full bg-white shadow-md flex items-center justify-center z-10">
<div class="w-4 h-4 rounded-full bg-primary relative pulse-marker"></div>
</div>
<!-- Destination Marker -->
<div class="absolute top-[30%] right-[25%] flex flex-col items-center z-10 -translate-y-full">
<div class="bg-white text-primary px-3 py-1 rounded-full shadow-md text-[12px] font-bold mb-1 whitespace-nowrap border border-soft-border">
                        Bella Notte
                    </div>
<div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center shadow-lg text-on-secondary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div class="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[8px] border-t-secondary -mt-0.5"></div>
</div>
<!-- SVG Route Line -->
<svg class="absolute inset-0 w-full h-full" preserveAspectRatio="none">
<path d="M 120 450 Q 200 350 280 250" fill="none" stroke="#f4a482" stroke-dasharray="8 6" stroke-linecap="round" stroke-width="4"></path>
<path d="M 120 450 Q 150 420 170 390" fill="none" stroke="#8c4e32" stroke-linecap="round" stroke-width="4"></path>
</svg>
</div>
</div>
<!-- Bottom Gradient Overlay -->
<div class="absolute bottom-0 w-full h-64 map-gradient-overlay pointer-events-none"></div>
<!-- Bottom Info Card -->
<div class="absolute bottom-0 left-0 right-0 z-30">
<div class="bg-white/95 backdrop-blur-lg rounded-t-[24px] shadow-xl p-4 flex flex-col gap-4 border-t border-soft-border">
<div class="w-12 h-1.5 bg-surface-dim rounded-full mx-auto -mt-2 mb-1"></div>
<!-- ETA and Distance -->
<div class="flex justify-between items-center border-b border-soft-border pb-4">
<div>
<p class="text-2xl font-display font-bold text-on-background">
                            12 <span class="text-lg font-body text-on-surface-variant font-normal">min</span>
</p>
<p class="text-[14px] text-on-surface-variant">0.8 mi • Walking</p>
</div>
<div class="text-right">
<p class="text-[14px] font-bold text-secondary">Arrival ~ 7:45 PM</p>
<div class="flex items-center justify-end gap-1 mt-1 text-[13px] text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary">group</span>
                            Sarah &amp; 2 others waiting
                        </div>
</div>
</div>
<!-- Next Direction -->
<div class="flex items-center gap-3 bg-surface-container-low p-3 rounded-xl border border-soft-border/50">
<div class="w-10 h-10 rounded-full bg-primary-container/20 text-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">turn_right</span>
</div>
<div class="flex-grow">
<p class="text-[14px] font-bold text-on-background">Turn right onto Via del Corso</p>
<p class="text-[13px] text-on-surface-variant">In 200 ft</p>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-2 mt-1">
<button class="w-full py-4 px-4 bg-secondary-container/40 text-on-secondary-container font-bold text-[16px] rounded-full border border-secondary-container/60 flex justify-center items-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">chat</span>
                        Message Group
                    </button>
<button class="w-full py-4 px-4 bg-primary text-on-primary font-bold text-[16px] rounded-full shadow-md flex justify-center items-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">where_to_vote</span>
                        I've Arrived
                    </button>
</div>
</div>
</div>
</main>



</body></html>
