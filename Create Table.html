<body class="antialiased font-body-md text-body-md pb-section-gap selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar - Linear/Transactional Intent, Back Action -->
<header class="flex justify-between items-center w-full px-container-padding py-stack-md bg-surface sticky top-0 z-40 bg-opacity-90 backdrop-blur-sm">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Create your table.</h1>
<div class="w-12 h-12"></div> <!-- Spacer for balance -->
</header>
<main class="px-container-padding max-w-2xl mx-auto space-y-section-gap pt-stack-md">
<!-- Section 1: Event Type (Chips) -->
<section class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface-variant">Gathering Type</h2>
<div class="flex flex-wrap gap-stack-sm"><button class="px-6 py-3 rounded-full border-[1.5px] border-primary-container bg-secondary-container/20 text-on-surface font-label-lg text-label-lg transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-primary-container">dinner_dining</span>
<span class="font-bold">Dinner</span>
</button>
<button class="px-6 py-3 rounded-full border border-outline-variant bg-transparent text-on-surface-variant font-label-lg text-label-lg hover:border-primary-container/50 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-outline-variant">lunch_dining</span>
<span>Lunch</span>
</button>
<button class="px-6 py-3 rounded-full border border-outline-variant bg-transparent text-on-surface-variant font-label-lg text-label-lg hover:border-primary-container/50 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-outline-variant">brunch_dining</span>
<span>Brunch</span>
</button>
<button class="px-6 py-3 rounded-full border border-outline-variant bg-transparent text-on-surface-variant font-label-lg text-label-lg hover:border-primary-container/50 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-outline-variant">local_cafe</span>
<span>Chai Meetup</span>
</button></div>
</section>
<!-- Section 2: Details (Glassmorphism Cards) -->
<section class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface-variant">The Details</h2>
<div class="space-y-stack-sm">
<!-- Restaurant Search -->
<div class="relative w-full group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-container transition-colors">search</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl glass-input font-body-md text-on-surface placeholder:text-outline-variant" placeholder="Search upscale restaurants..." type="text">
</div>
<div class="grid grid-cols-2 gap-stack-sm">
<!-- Date -->
<div class="relative w-full group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-container transition-colors">calendar_month</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl glass-input font-body-md text-on-surface" type="date">
</div>
<!-- Time -->
<div class="relative w-full group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-container transition-colors">schedule</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl glass-input font-body-md text-on-surface" type="time">
</div>
</div>
<div class="grid grid-cols-2 gap-stack-sm">

<option>6 Guests</option>
<option>8+ Guests</option>

</div>
</div>
<!-- Privacy Toggle -->

</div>

<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
</div>
</div>

<div class="bg-secondary-container/10 border-[1.5px] border-primary-container rounded-xl p-4 flex flex-col items-center text-center gap-2 cursor-pointer transition-colors relative overflow-hidden">

<span class="font-label-lg text-label-lg text-on-surface font-bold z-10">Social Conversation</span>
</div>
<div class="bg-surface-container-low border border-outline-variant/40 rounded-xl p-4 flex flex-col items-center text-center gap-2 cursor-pointer hover:border-primary-container transition-colors md:col-span-1 col-span-2">
<span class="material-symbols-outlined text-outline-variant text-[28px]">handshake</span>
<span class="font-label-lg text-label-lg text-on-surface">Business Networking</span>
</div></div>
</section>
<!-- Section 4: Description -->
<section class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface-variant">A Note to Guests</h2>
<div class="relative">
<textarea class="w-full p-4 rounded-xl glass-input font-body-md text-on-surface resize-none" placeholder="Looking for people who enjoy authentic Pakistani food..." rows="4"></textarea>
<span class="absolute bottom-4 right-4 font-label-sm text-label-sm text-outline-variant">0/200</span>

</section>
<!-- CTA Section -->
<section class="pt-stack-lg pb-section-gap">
<button class="w-full bg-primary-container text-on-primary py-4 rounded-xl font-headline-md text-headline-md shadow-sm hover:opacity-90 transition-opacity active:scale-[0.98] transform">
                Create Table
            </button>
</section>
</main>
<script>
  function setupSingleSelect(containerSelector, activeClasses, inactiveClasses) {
    const container = document.querySelector(containerSelector);
    if (!container) return;
    const buttons = container.querySelectorAll('button, .cursor-pointer');
    
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => {
          b.classList.remove(...activeClasses.split(' '));
          b.classList.add(...inactiveClasses.split(' '));
          const icon = b.querySelector('.material-symbols-outlined');
          if (icon) {
            icon.classList.remove('text-primary-container');
            icon.classList.add('text-outline-variant');
          }
          const text = b.querySelector('span:not(.material-symbols-outlined)');
          if (text) text.classList.remove('font-bold');
        });
        
        btn.classList.add(...activeClasses.split(' '));
        btn.classList.remove(...inactiveClasses.split(' '));
        const activeIcon = btn.querySelector('.material-symbols-outlined');
        if (activeIcon) {
          activeIcon.classList.add('text-primary-container');
          activeIcon.classList.remove('text-outline-variant');
        }
        const activeText = btn.querySelector('span:not(.material-symbols-outlined)');
        if (activeText) activeText.classList.add('font-bold');
      });
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    setupSingleSelect('section:nth-child(1) .flex-wrap', 'border-primary-container bg-secondary-container/20', 'border-outline-variant bg-transparent');
    setupSingleSelect('section:nth-child(3) .grid', 'border-primary-container bg-secondary-container/10', 'border-outline-variant/40 bg-surface-container-low');
  });
</script></body></html>
