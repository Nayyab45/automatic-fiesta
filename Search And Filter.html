<body class="min-h-screen pb-[80px] md:pb-0 font-body-md text-body-md overflow-x-hidden">

</div>
<div class="hover:opacity-80 transition-opacity cursor-pointer">
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant">

<h2 class="font-title-lg text-title-lg text-on-surface">Location &amp; Proximity</h2>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-gutter">
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-stack-sm uppercase">City</label>
<select class="w-full bg-transparent border-b border-outline-variant focus:border-primary-container py-2 text-on-surface focus:ring-0 outline-none">
<option value="karachi">Karachi</option>
<option value="lahore">Lahore</option>
<option value="islamabad">Islamabad</option>
</select>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-stack-sm uppercase flex justify-between">
<span>Distance</span>
<span class="text-primary-container" id="distance-val">5 km</span>
</label>
<div class="pt-2">
<input class="range-slider" max="25" min="1" oninput="document.getElementById('distance-val').innerText = this.value + ' km'" type="range" value="5"/>
</div>
</div>
</div>
</section>

<label class="flex items-center gap-3 cursor-pointer group">

<label class="flex items-center gap-3 cursor-pointer group">

</div>

</div>

<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant pt-2 hover:text-primary transition-colors group" href="#">

        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                this.classList.toggle('selected');
