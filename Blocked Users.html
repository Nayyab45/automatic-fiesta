<div class="flex flex-col gap-unit">
<span class="font-title-lg text-title-lg text-on-surface leading-tight text-[16px]">Sami Khan</span>

</div>
<button class="interactive-element px-4 py-2 rounded-full border border-primary-container text-on-surface font-label-lg text-label-lg bg-transparent hover:bg-surface-variant/50" onclick="unblockUser(this)">

            </p>

<script>
        function unblockUser(buttonElement) {
            const listItem = buttonElement.closest('li');
            
            // Add a simple fade-out animation before removal
            listItem.style.transition = 'opacity 0.3s ease, transform 0.3s ease, margin 0.3s ease, padding 0.3s ease, height 0.3s ease';
            listItem.style.opacity = '0';
            listItem.style.transform = 'translateX(20px)';
            
            setTimeout(() => {
                listItem.remove();
                checkEmptyState();
            }, 300);
        }

        function checkEmptyState() {
            const list = document.getElementById('blocked-users-list');
            const emptyState = document.getElementById('empty-state');
            
            if (list.children.length === 0) {
                list.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                
                // Small delay to allow display flex to apply before animating opacity
                setTimeout(() => {
                    emptyState.style.opacity = '1';
                }, 50);
            }
        }
    </script>
